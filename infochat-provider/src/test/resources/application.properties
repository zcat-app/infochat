# Test-scope configuration for infochat-provider integration tests.
# Per-IT @TestProfile classes provide test-specific overrides; this file
# holds settings common to every IT in the module.
#
# Subprocess-supervisor log suppression: M1-109's
# MultiAdapterProductionIT points the real SimpleXAdapter + SignalAdapter
# CDI beans at /bin/sleep as the subprocess binary so we don't depend on
# a real simplex-chat / signal-cli installation in CI. The subprocess
# launches with the adapter-defined arg list (-d <dataDir> --network ...
# for SimpleX; --config <dataDir> -a <account> daemon --tcp ... for
# Signal), /bin/sleep rejects those flags, exits non-zero, and the
# supervisor's WARN logs about "simplex-chat launch failed" / "signal-cli
# launch failed" repeat on every backoff cycle until the crash cap fires.
# That noise does not indicate a test failure — adapter.start() succeeds
# because the in-process fake binds the WS / TCP endpoint the adapter
# probes — but it floods the build log. Suppressing the two supervisor
# loggers to ERROR keeps real failures visible while filtering the
# expected backoff chatter. Per-IT profiles can still re-enable WARN
# or DEBUG via getConfigOverrides() when a test needs supervisor visibility.
quarkus.log.category."app.zcat.infochat.messaging.impl.simplex.SimpleXSubprocess".level=ERROR
quarkus.log.category."app.zcat.infochat.messaging.impl.signal.SignalSubprocess".level=ERROR

# Parallel-worktree isolation (M1 runs concurrent per-ticket worktree
# verifies): bind the @QuarkusTest HTTP server to an OS-assigned
# ephemeral port instead of the fixed default 8081, so two suites
# reaching their IT phase at the same moment cannot collide
# (QuarkusBindException: Port already bound: 8081). Quarkus writes the
# resolved port back into `quarkus.http.test-port`; tests that need
# the port read that key instead of hardcoding a number.
quarkus.http.test-port=0

# Retrieval-eval runner build profile (M1-929): the runner boots under
# %eval; this build-time bean exclusion removes the suite's M1-644 stubs
# from that boot only (module-wide is impossible — see the runner).
%eval.quarkus.arc.exclude-types=app.zcat.infochat.provider.testing.TestLlmProvider,app.zcat.infochat.provider.testing.StubEmbeddingProvider
