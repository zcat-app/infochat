# infochat-provider — datasource and profile namespaces.
#
# In production, Provider does NOT migrate: the operator runs Collector
# first (which applies V1/V2/V4 from the infochat-core classpath), then
# Provider. The migrations themselves live in infochat-core (M1-017) so
# both services see them on classpath via their transitive dependency.
# quarkus-flyway is test-scoped in Provider's pom, gated by the %test
# property below, so @QuarkusTest applies the same migrations against
# the DevServices container — keeping Provider's test schema aligned
# with production without sharing Collector's container.

# HTTP listener — serves only the SmallRye Health probes in v1
# (/q/health/live, /q/health/ready; docs/design/07-deployment.md §7.12).
# Per-service port (collector=8080, provider=8081) so the two services
# never collide on a single host (07-deployment.md §Per-service
# application.properties). @QuarkusTest binds quarkus.http.test-port
# (default 8081) instead, so this key is inert under %test.
quarkus.http.port=8081

# Least-privilege role split (docs/spec/security.md §DB roles; V31 grants
# the service roles LOGIN). The DEFAULT datasource connects as the
# per-service role so every plain @Inject DataSource site — including any
# future code that forgets to qualify — gets the weak principal
# (fail-closed). Unlike the Collector, the production Provider carries NO
# owner datasource at all: the user-facing service must never hold owner
# credentials. The owner datasource exists only under %test, where the
# test-scoped Flyway and the seed seam (M1-163) need owner privilege
# against the DevServices container.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=infochat_provider
# No baked-in fallback on the production-shaped key: a deployment that
# forgets INFOCHAT_PROVIDER_PASSWORD must fail startup fast instead of
# connecting with a publicly known dev password
# (docs/design/07-deployment.md §Environment variables: required, no
# default). %dev/%test carry the dev-only value explicitly; under %test
# the DevServices container's trust auth makes the value inert anyway.
quarkus.datasource.password=${INFOCHAT_PROVIDER_PASSWORD}
%dev.quarkus.datasource.password=infochat-dev
%test.quarkus.datasource.password=infochat-dev

# DevServices uses the same pgvector image as docker-compose so the
# Provider's test container matches the schema layout Collector applies
# in production. The JDBC URL is intentionally NOT declared at this base
# level so the test profile triggers DevServices.
#
# The container's superuser identity is pinned to the owner — NOT derived
# from the (now weak-role) default-datasource username. Without the pin,
# DevServices would create `infochat_provider` as the container superuser;
# V2's create-if-absent would leave it superuser and the role split would
# silently stop being exercised under test while every assertion stayed
# green. Trust auth lets the V2-created (password-less) service roles log
# in inside the ephemeral test container.
quarkus.datasource.devservices.image-name=pgvector/pgvector:pg16
quarkus.datasource.devservices.username=infochat
quarkus.datasource.devservices.container-env.POSTGRES_HOST_AUTH_METHOD=trust

# %test-only owner datasource: shares the ONE DevServices container (URL
# expression resolves at runtime to the DevServices-injected default URL;
# DevServices itself is disabled for the named datasource). Used by the
# test-scoped Flyway below and the M1-163 seed seam. Trust auth makes the
# password value irrelevant inside the test container.
%test.quarkus.datasource.owner.db-kind=postgresql
%test.quarkus.datasource.owner.username=infochat
%test.quarkus.datasource.owner.password=infochat-dev
%test.quarkus.datasource.owner.devservices.enabled=false
%test.quarkus.datasource.owner.jdbc.url=${quarkus.datasource.jdbc.url}

# Explicit Agroal pool ceiling (rather than the implicit Agroal default
# 20). Demand arithmetic: two long-lived pool connections are pinned for
# the JVM lifetime — InstanceLockGuard's advisory-lock session and
# NewPostListener's LISTEN/NOTIFY session; the @Scheduled DB-touching
# jobs (HeartbeatScheduler, DigestScheduler, ChatMemoryPruner) hold at
# most 1 transient connection per tick; the remaining demand is inbound
# command/chat handling, bounded by the adapter-side rate caps
# (infochat.rate-cap.inbound-per-minute, infochat.chat.llm-rate-cap-*).
#   laptop     = 12  (2 pinned + 3 jobs + ~4 concurrent inbound, rounded up)
#   vps        = 16  (2 pinned + 3 jobs + ~8 concurrent inbound, production)
#   pi / remote-llm → base fallback
# The base default below provides the test-time fallback the same way
# infochat.heartbeat.interval does, and matches the vps value so the
# %pi / %remote-llm fallback never under-provisions. A future
# profile-tuning ticket may pin those two profiles explicitly.
quarkus.datasource.jdbc.max-size=16

# Flyway is test-scoped: only @QuarkusTest applies migrations. Production
# Provider does not pull the extension, so this property is a no-op
# outside %test. Bound to the named owner datasource (the `owner`
# segment): migrations must run as the schema owner, not as the weak
# per-service role on the default datasource.
%test.quarkus.flyway.owner.migrate-at-start=true

# Messaging stack defaults for %test. M1-035b's MessagingStartup
# @PostConstruct calls AdapterRegistry.start() at boot, which runs the
# six §6.7 startup gates against `infochat.adapters`. Production operators
# MUST set this property (gate 1 fail-fast if unset); the test profile
# defaults to the in-memory adapter so @QuarkusTest classes that do not
# care about messaging still boot cleanly. Test classes that need a
# different adapter shape (T3-A's SimpleX/Signal) override via
# @TestProfile.
%test.infochat.adapters=inmemory
%test.infochat.adapters.inmemory.allow-low-trust=true

# Bootstrap admin per enabled adapter (M1-105). Per docs/spec/deployment.md
# §Operator inputs item 2: each enabled adapter may declare
# `infochat.adapters.<name>.admin=<contact-id>` and individual adapters
# may omit it, but the union across activated adapters MUST be non-empty
# (gate 7 in AdapterRegistry). The @Startup admin-bootstrap bean
# READS this property and ensures the configured contact exists with
# is_admin=true (creating the user if needed).
# Production operators MUST declare the property explicitly per enabled
# adapter. The %test default seeds a synthetic contact id so the default
# inmemory adapter satisfies gate 7 for the in-tree @QuarkusTest suite.
%test.infochat.adapters.inmemory.admin=test-bootstrap-contact

# Heartbeat tick base default. Quarkus' `test` profile (which @QuarkusTest
# runs under) does not inherit from any `%<infochat-profile>` namespace, so
# `%laptop.infochat.heartbeat.interval` is invisible to tests. Declaring
# the same value at base provides the test-time fallback while the
# `%laptop.*` declaration below remains the production-facing value
# (D41 / docs/design/07-deployment.md §7.8.5).
#
# %vps, %pi, and %remote-llm profiles intentionally do NOT yet declare this
# key — they fall back to the base value at deploy time. A future profile-
# tuning ticket adds explicit overrides per the design-suggested values in
# docs/design/07-deployment.md §7.2.1 (laptop stays at 5s; vps, pi, and
# remote-llm get their own values). Until that ticket lands, those three
# profiles silently inherit 5s from base, which is too aggressive for
# Pi-class hardware in particular — operator-side mitigation is to override
# `infochat.heartbeat.interval` via environment or system property.
infochat.heartbeat.interval=5s

# Asset-snapshot refresh cadence (design §10.4). Read by AssetSnapshotReader
# to compute the 2x-interval stale marker; the keys mirror the collector's
# infochat.assets.refresh.* values (collector base 90s; laptop 60s; pi 300s;
# vps/remote-llm 90s) so a snapshot's staleness is judged against the same
# cadence the collector fetched it at. Both services bind these as Duration
# ("90s"), so a single -Dinfochat.assets.refresh.<host>=<duration> override
# is valid in both. No inline defaultValue on the @ConfigProperty fields —
# application.properties is the source of truth (FetchScheduler.java:140
# profile-driven-key convention).
infochat.assets.refresh.coingecko=90s
infochat.assets.refresh.kraken=90s
infochat.assets.refresh.bitfinex=90s

# Outbound-delivery retry + bot-removed cleanup (design 06-messaging.md
# §6.3.6, §Permanent-delivery-failure cleanup). Read by OutboundDelivery.
# These BASE defaults are mandatory, not just placeholders: Quarkus' `test`
# profile (which @QuarkusTest runs under) does not inherit any
# %<infochat-profile> namespace, so the %laptop/%vps/%pi/%remote-llm
# overrides below are invisible to tests — the retry and threshold tests
# read these base values. max-attempts and growth-factor are uniform across
# profiles (design table varies only base-delay and threshold); base-delay
# and threshold are mirrored per profile below as the production-facing
# values. Full jitter: each retry delay is sampled from [0, base*growth^k).
infochat.messaging.retry.max-attempts=3
infochat.messaging.retry.base-delay-ms=250
infochat.messaging.retry.growth-factor=2.0
infochat.messaging.permanent-failure-threshold=3

# Per-profile namespaces — populated by later feature tickets. Each
# profile carries one placeholder so the namespace exists in v1.
%laptop.infochat.heartbeat.interval=5s
%laptop.infochat.profile.label=laptop
%laptop.infochat.assets.refresh.coingecko=60s
%laptop.infochat.assets.refresh.kraken=60s
%laptop.infochat.assets.refresh.bitfinex=60s
%laptop.infochat.messaging.retry.base-delay-ms=250
%laptop.infochat.messaging.permanent-failure-threshold=3
%laptop.quarkus.datasource.jdbc.max-size=12
%laptop.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/infochat
%pi.infochat.profile.label=pi
%pi.infochat.assets.refresh.coingecko=300s
%pi.infochat.assets.refresh.kraken=300s
%pi.infochat.assets.refresh.bitfinex=300s
%pi.infochat.messaging.retry.base-delay-ms=500
%pi.infochat.messaging.permanent-failure-threshold=5
%pi.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/infochat
%remote-llm.infochat.profile.label=remote-llm
%remote-llm.infochat.assets.refresh.coingecko=90s
%remote-llm.infochat.assets.refresh.kraken=90s
%remote-llm.infochat.assets.refresh.bitfinex=90s
%remote-llm.infochat.messaging.retry.base-delay-ms=500
%remote-llm.infochat.messaging.permanent-failure-threshold=3
%remote-llm.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/infochat
%vps.infochat.profile.label=vps
%vps.infochat.assets.refresh.coingecko=90s
%vps.infochat.assets.refresh.kraken=90s
%vps.infochat.assets.refresh.bitfinex=90s
%vps.infochat.messaging.retry.base-delay-ms=250
%vps.infochat.messaging.permanent-failure-threshold=3
%vps.quarkus.datasource.jdbc.max-size=16
%vps.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/infochat

# InboundRouter body-size cap (defense in depth). The router enforces this
# UTF-8 byte ceiling BEFORE running the Unicode normalization pass so that
# adversarial inputs (Hangul jamo expansion, deep combining-mark sequences)
# cannot amplify NFKC cost. The adapter SPI's `maxInboundMessageBytes`
# (CapabilityFlags) is the honor-system per-adapter cap; production adapters
# (SimpleX, Signal) land in T3-A and enforce it. The router cap fires even
# when a misbehaving adapter lets a larger payload through.
#
# The default 64 KiB is below the InMemoryAdapter's declared 100 KB so a
# misbehaving adapter still gets stopped here. Bodies exceeding the cap
# are dropped with the fixed too-large reply; the normalization pass is
# never invoked on the input. Per-profile overrides are intentionally NOT
# declared in v1 — the same cap is appropriate across laptop / vps / pi /
# remote-llm because the threat surface (NFKC amplification) is profile-
# independent.
infochat.router.max-inbound-body-bytes=65536

# Intake-step splice config (M1-044b).
# Per docs/spec/security.md §Authorization model + §Rate limiting and
# docs/design/04-security.md §4.5 / §4.9 + docs/design/03-commands.md
# §3.10. Laptop defaults; per-profile overrides land in a follow-up.
# RateCapBucket reads infochat.rate-cap.* (T1 / step 1.5);
# InviteCodeConsumer reads infochat.invite.brute-force-* + .ttl (step 2);
# AutoRegisterService + InviteCodeConsumer share infochat.probation.duration.
# infochat.invite.open-cap-per-adapter + .contact-cap-global are consumed
# by /invite create (M1-044c); the keys are declared here so the v1
# config surface is complete at the M1-044b commit boundary.
infochat.rate-cap.inbound-per-minute=60
infochat.invite.brute-force-threshold=10
infochat.invite.brute-force-window=1h
infochat.invite.ttl=7d
infochat.invite.open-cap-per-adapter=3
infochat.invite.contact-cap-global=50
infochat.probation.duration=24h

# Pre-dispatch confirm gate window (M1-051). Per docs/design/03-commands.md
# §Confirmation for destructive commands: laptop/vps/remote-llm 60s, pi 90s
# (a generous window accommodates slower Pi-class chat clients). The
# ConfirmStateService stores pending entries keyed by (actor, scope) and
# expires them lazily — no background sweep, no DB persistence.
infochat.confirm.timeout=60s
%laptop.infochat.confirm.timeout=60s
%vps.infochat.confirm.timeout=60s
%pi.infochat.confirm.timeout=90s
%remote-llm.infochat.confirm.timeout=60s

# Per-user /save cap (M1-052). Per docs/design/02-schema.md §2.6.1 +
# docs/design/03-commands.md §`/save`: the cap exists at spec level
# (commands.md §Content "saved-post library is bounded by a profile-driven
# per-user cap"), the value is design-tier and pinned at 1000 across
# laptop / vps / remote-llm. Pi inherits the base default — design notes
# do not pin a separate Pi value. The %test override is small so
# cap-saturation scenarios in handler unit tests stay cheap.
infochat.save.cap=1000
%laptop.infochat.save.cap=1000
%vps.infochat.save.cap=1000
%remote-llm.infochat.save.cap=1000
%test.infochat.save.cap=3

# /summary cluster-cap per docs/design/03-commands.md §`/summary` — caps
# the eligible-post set passed into prose generation. The base default
# matches laptop; %vps / %pi / %remote-llm override below. Beyond the
# cap the OLDEST eligible posts are dropped and the reply prefix calls
# the excluded count out via reply.summary.cap_excess_notice.
infochat.summary.cluster-cap=200
%laptop.infochat.summary.cluster-cap=200
%vps.infochat.summary.cluster-cap=100
%pi.infochat.summary.cluster-cap=50
%remote-llm.infochat.summary.cluster-cap=500

# ClusterTraversal depth-limit (M1-093). Bounds the per-cluster radius
# of the BFS over post_reference edges so a single highly-connected
# component cannot pull in arbitrarily distant posts. The default (3)
# matches the LinkingJob lookback shape — within ~3 hops the graph
# stays cohesive; beyond that the linked posts are likely to be only
# tangentially related. Operators can widen the value for richer
# clustering at the cost of broader cluster heads.
infochat.provider.cluster-traversal.depth-limit=3
%laptop.infochat.provider.cluster-traversal.depth-limit=3
%vps.infochat.provider.cluster-traversal.depth-limit=3
%pi.infochat.provider.cluster-traversal.depth-limit=2
%remote-llm.infochat.provider.cluster-traversal.depth-limit=4

# LLM provider defaults. Provider's /summary command consumes the
# M1-033 LlmProvider via the SUMMARIZER task; the OpenAi-compatible
# provider bean is discovered from infochat-llm-adapter on the
# classpath and reads its per-task (base-url, api-key, model,
# timeout-ms) keys dynamically at call time — the library defaults
# nothing, so Provider must declare the keys for every task it routes.
# The values below match Collector's defaults — Ollama-local is the v1
# baseline; a deployment that points at a remote endpoint overrides
# per-profile or via environment variables.
infochat.llm.local-only=false
infochat.llm.security.api-key=
infochat.llm.security.base-url=http://localhost:11434/v1
infochat.llm.security.model=llama3.2:3b
infochat.llm.security.timeout-ms=30000
infochat.llm.security.max-concurrency=4
# LlmRouter.assertAllTasksResolve() eagerly resolves EVERY ModelTask's
# per-task config at startup (a missing or typoed required key must
# refuse boot, not silently degrade the first live call), so the
# Provider declares all six task blocks — including tagger/entity,
# whose live call sites run only in the Collector. Same local-Ollama
# defaults as Collector; model per
# docs/design/05-llm-and-embeddings.md §5.1 (llama3.1:8b).
infochat.llm.tagger.api-key=
infochat.llm.tagger.base-url=http://localhost:11434/v1
infochat.llm.tagger.model=llama3.1:8b
infochat.llm.entity.api-key=
infochat.llm.entity.base-url=http://localhost:11434/v1
infochat.llm.entity.model=llama3.1:8b
infochat.llm.summarizer.api-key=
infochat.llm.summarizer.base-url=http://localhost:11434/v1
infochat.llm.summarizer.model=llama3.1:8b
infochat.llm.chat.api-key=
infochat.llm.chat.base-url=http://localhost:11434/v1
infochat.llm.chat.model=llama3.1:8b
infochat.llm.translator.api-key=
infochat.llm.translator.base-url=http://localhost:11434/v1
infochat.llm.translator.model=llama3.1:8b
%remote-llm.infochat.llm.anthropic.languages=en,cs
%remote-llm.infochat.llm.chat.base-url=https://api.anthropic.com/v1
%remote-llm.infochat.llm.chat.max-tokens=2048
%remote-llm.infochat.llm.chat.model=claude-sonnet-4-6
%remote-llm.infochat.llm.chat.provider=anthropic
%remote-llm.infochat.llm.summarizer.base-url=https://api.anthropic.com/v1
%remote-llm.infochat.llm.summarizer.max-tokens=4096
%remote-llm.infochat.llm.summarizer.model=claude-opus-4-8
%remote-llm.infochat.llm.summarizer.provider=anthropic
# Translator must carry the full anthropic block: anthropic.languages=en,cs
# makes AnthropicProvider the priority-2 route for non-English TRANSLATOR
# calls, and the Anthropic API requires max-tokens (the base Ollama block
# has none). Without these keys the widened startup validation refuses boot.
%remote-llm.infochat.llm.translator.base-url=https://api.anthropic.com/v1
%remote-llm.infochat.llm.translator.max-tokens=4096
%remote-llm.infochat.llm.translator.model=claude-sonnet-4-6
%remote-llm.infochat.llm.translator.provider=anthropic

# Index the infochat-llm-adapter jar for ArC bean discovery. The
# adapter jar carries no META-INF/beans.xml and no precomputed jandex
# index, so without this directive Quarkus would not see
# OpenAiCompatibleProvider / LlmRouter as CDI beans and
# SummaryProseGenerator's @Inject LlmRouter would fail with an
# UnsatisfiedResolutionException at boot. Same shape as Collector's
# index-dependency entry for the same jar.
quarkus.index-dependency.llm-adapter.group-id=app.zcat.infochat
quarkus.index-dependency.llm-adapter.artifact-id=infochat-llm-adapter

# Index infochat-core for ArC bean discovery. M1-041's AuditLogWriter
# + DefaultRedactionHook are @ApplicationScoped beans in
# infochat-core/audit; without this directive Quarkus would not see
# them and the seven Provider call sites (Ban/Unban/Invite handlers,
# InviteCodeConsumer, SourceUpsertService, LlmOutputSanitizer) would
# fail with UnsatisfiedResolutionException at boot. Same shape as
# the llm-adapter entry above.
quarkus.index-dependency.audit-core.group-id=app.zcat.infochat
quarkus.index-dependency.audit-core.artifact-id=infochat-core

# Stdout log redaction: every console log line passes through the
# closed API-key catalogue (Redactor) via RedactingLogFilter.
quarkus.log.console.filter=api-key-redactor

# Chat-mode body cap (M1-063). Per spec §Input length limits: the cap is
# profile.context_window / 8 chars. The base default matches laptop;
# per-profile overrides follow each profile's context-window budget.
# Messages exceeding this cap receive a friendly error; no LLM call.
infochat.chat.body-cap=2048
%laptop.infochat.chat.body-cap=2048
%vps.infochat.chat.body-cap=1024
%pi.infochat.chat.body-cap=512
%remote-llm.infochat.chat.body-cap=4096
%test.infochat.chat.body-cap=256

# Slash-command body cap. commands.md §Input length caps commits to a
# second cap for slash commands (the chat cap above covers non-slash);
# design/03-commands.md assigns the per-profile values. A slash body
# exceeding this cap receives a friendly error before the parser; no
# DB write, no dispatch.
infochat.command.body-cap=8192
%laptop.infochat.command.body-cap=8192
%vps.infochat.command.body-cap=4096
%pi.infochat.command.body-cap=2048
%remote-llm.infochat.command.body-cap=16384
%test.infochat.command.body-cap=256

# Progress-notifier edit-coalescing floor (M1-212). The StageProgressNotifier
# emits at most one update() per this interval per evolving message; design
# 06-messaging.md §6.3.8 records 600ms. v1 uses this single system-wide floor
# only — the spec's max(adapterMin, systemFloor) degrades to systemFloor
# because per-adapter adapterMin is not exposed. The terminal finalize is
# always sent regardless of the window.
infochat.messaging.progress.min-edit-interval-ms=600

# Per-user LLM-triggering rate cap for chat mode (M1-068). Sliding window
# over 60 s; exceeding the cap returns a friendly error, no LLM call.
infochat.chat.llm-rate-cap-per-minute=10
%laptop.infochat.chat.llm-rate-cap-per-minute=10
%vps.infochat.chat.llm-rate-cap-per-minute=10
%pi.infochat.chat.llm-rate-cap-per-minute=5
%remote-llm.infochat.chat.llm-rate-cap-per-minute=20
%test.infochat.chat.llm-rate-cap-per-minute=3

# Export page cap (M1-067). Separate from chat body-cap because export
# output page sizing and chat input gating have different test values.
infochat.export.page-cap=2048
%laptop.infochat.export.page-cap=2048
%vps.infochat.export.page-cap=1024
%pi.infochat.export.page-cap=512
%remote-llm.infochat.export.page-cap=4096

# Context-window ceiling and auto-compress threshold (M1-064). Per
# docs/design/03-commands.md §3.9 and docs/design/05-llm-and-embeddings.md
# §5.7. The threshold is the token_count at which auto-compress fires
# (deterministic, not LLM-judged). §3.9 percentages are authoritative:
# laptop=75%, vps=75%, pi=60%, remote-llm=80%.
infochat.context-window=16384
%laptop.infochat.context-window=16384
%vps.infochat.context-window=8192
%pi.infochat.context-window=4096
%remote-llm.infochat.context-window=32768
%test.infochat.context-window=256
infochat.context-compress-at=12288
%laptop.infochat.context-compress-at=12288
%vps.infochat.context-compress-at=6144
%pi.infochat.context-compress-at=2458
%remote-llm.infochat.context-compress-at=26214
%test.infochat.context-compress-at=128

# /stop statement_timeout (M1-065). Per spec §/stop: "bounds the worst case
# even when pg_cancel_backend fails." Values from docs/design/03-commands.md §3.9.
infochat.stop.statement-timeout=30s
%laptop.infochat.stop.statement-timeout=30s
%vps.infochat.stop.statement-timeout=15s
%pi.infochat.stop.statement-timeout=60s
%remote-llm.infochat.stop.statement-timeout=30s
%test.infochat.stop.statement-timeout=5s

# /retry cap (M1-065). Per spec §/retry: "profile-driven retry cap."
# Values from docs/design/03-commands.md §3.9.
infochat.retry.cap=3
%laptop.infochat.retry.cap=3
%vps.infochat.retry.cap=3
%pi.infochat.retry.cap=2
%remote-llm.infochat.retry.cap=5
%test.infochat.retry.cap=2

# /retry status-drift threshold (M1-065). 25% across all profiles.
infochat.retry.status-drift-threshold=0.25

# Periodic digest scheduling (M1-080a). Slot hours are 24-h local time
# of the group; window width is the stagger spread in minutes.
infochat.digest.morning-slot-hour=8
infochat.digest.evening-slot-hour=20
infochat.digest.window-width-minutes=30
%pi.infochat.digest.window-width-minutes=60
infochat.digest.tick-interval=60s
%test.infochat.digest.tick-interval=off

# D47 group approval gate (M1-112). Per docs/design/04-security.md §4.9
# (per-group rate caps + per-user activation cap + global max-groups).
# Per-group reply rate is shared across approval states and bounds outbound
# adapter-send cost in pending/rejected/approved alike; exhaustion silently
# drops the @mention. Activation cap counts rows where
# activated_by=user.id AND approval_status IN ('pending','approved','rejected')
# AND removed_at IS NULL (prevents activate-reject-reactivate cycling).
# Global max-groups counts rows where removed_at IS NULL AND approval_status
# IN ('pending','approved') (rejected groups impose no ongoing cost).
infochat.ratelimit.group-reply-per-15min=10
%laptop.infochat.ratelimit.group-reply-per-15min=10
%vps.infochat.ratelimit.group-reply-per-15min=20
%pi.infochat.ratelimit.group-reply-per-15min=5
%remote-llm.infochat.ratelimit.group-reply-per-15min=20
%test.infochat.ratelimit.group-reply-per-15min=100
# Per-group LLM sub-bucket (M1-222) per docs/design/04-security.md §4.9:
# approved-group backstop behind the per-user LlmRateCap; overflow sends
# the fixed group.llm_rate_limit reply. Periodic digests never consume it.
infochat.ratelimit.group-llm-per-15min=5
%laptop.infochat.ratelimit.group-llm-per-15min=5
%vps.infochat.ratelimit.group-llm-per-15min=10
%pi.infochat.ratelimit.group-llm-per-15min=3
%remote-llm.infochat.ratelimit.group-llm-per-15min=10
%test.infochat.ratelimit.group-llm-per-15min=100
# Per-group command sub-bucket (M1-222 redteam follow-up) per
# docs/design/04-security.md §4.9: bounds aggregate slash-command dispatch
# volume from approved groups; overflow sends the fixed
# group.command_rate_limit reply. DM slash dispatch never consults it.
infochat.ratelimit.group-commands-per-15min=20
%laptop.infochat.ratelimit.group-commands-per-15min=20
%vps.infochat.ratelimit.group-commands-per-15min=40
%pi.infochat.ratelimit.group-commands-per-15min=10
%remote-llm.infochat.ratelimit.group-commands-per-15min=40
%test.infochat.ratelimit.group-commands-per-15min=100
infochat.groups.per-user-activation-cap=3
%laptop.infochat.groups.per-user-activation-cap=3
%vps.infochat.groups.per-user-activation-cap=5
%pi.infochat.groups.per-user-activation-cap=3
%remote-llm.infochat.groups.per-user-activation-cap=10
%test.infochat.groups.per-user-activation-cap=3
infochat.groups.global-max-groups=10
%laptop.infochat.groups.global-max-groups=10
%vps.infochat.groups.global-max-groups=50
%pi.infochat.groups.global-max-groups=5
%remote-llm.infochat.groups.global-max-groups=100
%test.infochat.groups.global-max-groups=5
