infochat.groups.global-max-groups=10
%laptop.infochat.groups.global-max-groups=10
%vps.infochat.groups.global-max-groups=50
%pi.infochat.groups.global-max-groups=5
%remote-llm.infochat.groups.global-max-groups=100
%test.infochat.groups.global-max-groups=5

# Operator-declared Nitter instance hosts (M1-456). Comma-separated host
# allowlist consumed by KindResolver: a /add-source URL whose host (or a
# subdomain of it) is listed resolves to kind='nitter' without an explicit
# --type, and that host cannot be forced to a non-nitter --type. Nitter is
# self-hosted on arbitrary, churning domains with no canonical host, so the
# operator naming their instance(s) is the only reliable signal — the same
# trust model as bootstrap-sources.json. Empty by default: behaviour is
# unchanged except that an explicit `--type nitter` is accepted. Host-list
# membership is deployment-specific, so there are no per-profile overrides.
infochat.sources.nitter-hosts=
