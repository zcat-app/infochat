# ----- Conceptual topic corpus (M1-649, D68) -------------------------------
# Per docs/spec/commands.md §Chat mode + decision D68. The corpus lives in
# HelpTopicCorpus (one intent-shaped match doc per topic, indexed under
# doc_kind='topic'); these keys are the SERVED answers — reviewed product
# copy, plain text (D30), bundle-localized (D43), bypassing TranslationPipeline
# (the D43 two-path rule). Naming: topic.<slug>.answer mirrors the topic's
# HelpTopicCorpus slug.
topic.getting-access.answer=infochat работает только по приглашениям. Администратор выдаёт вам одноразовый код приглашения; отправьте этот код боту первым же личным сообщением — и вы будете зарегистрированы. Новые учётные записи начинают с короткого испытательного периода с ограниченным набором команд и выключенным режимом чата — это нормально и временно. Полный доступ открывается по окончании испытательного периода или раньше, если за вас поручится администратор. Команда /help в любой момент покажет, что именно вам сейчас доступно.
topic.probation.answer=Испытательный период — это фаза медленного старта, через которую проходит каждая новая учётная запись. Первые 24 часа после регистрации (согласно настройке испытательного периода в этом развёртывании) вам доступен ограниченный набор команд, а режим чата выключен — работают только команды чтения каталога плюс /lang, /forget и /stop. По окончании испытательного периода открывается полный набор команд и режим чата. Администратор также может завершить его досрочно, поручившись за вас. Приветственное сообщение и /help показывают срок испытательного периода и то, какие команды доступны.
topic.chat-vs-commands.answer=С ботом можно общаться двумя способами. Команды начинаются с косой черты — например /summary, /save, /follow-tag — и выполняют точные, воспроизводимые действия. Всё остальное — вопрос в чате обычным языком, удобный для уточнений и исследования темы. Их можно свободно смешивать в одном разговоре. Бот отвечает обычным текстом; ссылки приходят голыми веб-адресами, которые можно нажать или скопировать.
topic.chat-assistant-boundary.answer=Помощник в чате работает только на чтение. Он ищет и объясняет ваши новости, но никогда не может изменить настройки, что-либо опубликовать или действовать как администратор. Он видит только ваши подписки и ту область, в которой вы общаетесь, — он не может получить данные другого пользователя или другого разговора. Если ответ готовится слишком долго, /stop отменит его.
topic.dm-vs-group.answer=infochat работает и в личных сообщениях, и в группах. В личной переписке просто напишите боту, и он ответит. В группе упомяните бота через @ — или дождитесь его утреннего и вечернего дайджеста по расписанию. Настройки уровня группы (язык, время дайджестов, источники группы) ведут администраторы группы, но ваш личный контекст и сохранения всегда принадлежат вам и никогда не видны другим участникам. Одобренные группы также получают автоматические дайджесты свежих публикаций.
topic.unfollow-vs-delete.answer=/unfollow-source <id> лишь убирает источник из вашей области (только для вас в личной переписке или для всей группы, когда это делает её администратор). Сам источник остаётся: другие области по-прежнему его видят, и публикации продолжают к ним поступать. Полное удаление источника (из всего развёртывания) — действие администратора бота: спросите администратора, если общий источник пора убрать. Итого: отписка действует в пределах области и обратима; удаление — глобально, необратимо и доступно только администратору.
topic.add-source-requires-tags.answer=/add-source требует хотя бы одного значения --tags, потому что каждая публикация должна поддаваться сортировке по темам, а автоматическая расстановка тегов иногда не срабатывает. Указав хотя бы один тег при добавлении источника, вы гарантируете, что его публикации всё равно попадут в дайджесты и /summary, даже когда автотеггеру нечего уверенно предложить. Теги, заданные при добавлении, становятся ещё и общими стартовыми тегами источника — их видят все, кто его отслеживает, — поэтому выбирайте их с учётом этого. Для настройки того, что видите лично вы, используйте /follow-tag.
topic.personal-vs-shared-tags.answer=Теги существуют на двух уровнях. У каждого источника есть общие стартовые теги, заданные при его добавлении и изменяемые только администратором бота, — они действуют на всех, кто отслеживает этот источник. Поверх этого у каждого пользователя есть личный выбор через /follow-tag, который настраивает только его собственную ленту: по умолчанию вы видите всё из своих источников, а как только вы выполните /follow-tag для темы, вы переключаетесь на режим "только выбранные мной темы" (лично для вас, в этой области). /unfollow-tag убирает одну тему; /unfollow-tag --all возвращает вас к виду по умолчанию — всё из моих источников.
topic.clear-vs-forget.answer=/clear и /forget обе стирают данные разговора, но в разном объёме. /clear убирает только краткосрочный контекст текущего разговора — долговременная память и сохранённые публикации остаются. /forget — полная приватная очистка: она стирает всё, что бот хранит от вашего имени в этой области (память чата, текущий разговор и вашу библиотеку сохранённых публикаций — сохранения глобальны, поэтому они стираются, из какого бы разговора вы ни выполнили /forget). /clear обратима: бот восстанавливает контекст по ходу общения. /forget необратима и сначала просит подтверждения.
topic.forget-erasure.answer=/forget стирает — в той области, где вы её выполнили: вашу память чата (строки chat_memory этого разговора), ваши сессии чата и их сообщения (строки chat_session и chat_message этого разговора) и ваши личные опорные точки сводок (строки summary_anchor, помеченные как личные для этого разговора). Она также стирает вашу библиотеку сохранённых публикаций глобально — строки saved_post вашего пользователя во всех областях, поскольку сохранения глобальны согласно решению D13. /forget НЕ затрагивает: вашу блокировку или статус администратора, ваше членство в группах и защищённый от изменений журнал аудита системы (в нём фиксируется, что действия происходили, но никогда не содержание ваших сообщений). Она сообщит, если у вас остались данные в других разговорах, чтобы вы могли очистить и их.

# ----- /image (D73/D75/D76; commands.md §Content) ---------------------------
help.cmd.image.short=/image [--resolution|-r <WxH>] [--prompt|-p] <текст> — сгенерировать изображение
help.cmd.image.usage=/image [--resolution|-r <WxH>] [--prompt|-p] <текст>\n\nГенерирует изображение на настроенной оператором backend-системе и отправляет его сюда, повторяя фактически использованный английский prompt.\n\n  --resolution, -r  необязательный размер вывода в виде WxH (ограничен серверным пределом)\n  --prompt, -p      всё, что следует после этого флага, — это prompt, дословно\n\nГенерации расходуют почасовой кредит и соблюдают короткую паузу; когда очередь backend велика, команда отказывает, а не ставит в очередь сверх бюджета.
help.cmd.image.examples=\ \ /image a red bicycle on a wicker chair\n  /image -r 1024x1024 -p a blue door in morning light
