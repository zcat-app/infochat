reply.summary.no_posts_yet=Пока нет публикаций для сводки за это окно. Попробуйте более широкое окно (например /summary -w 7d). Ваш дайджест охватывает все ваши источники; сузьте его командой /follow-tag <topic> — или /unfollow-tag --all, если сузили слишком сильно.
reply.summary.no_subscriptions=В этой области не видно ни одного источника — все стандартные источники здесь исключены, а другие не отслеживаются. Выполните /follow-all-sources, чтобы вернуть стандартные источники.
