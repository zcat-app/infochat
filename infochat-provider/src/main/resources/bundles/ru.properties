# Deterministic Russian bundle for Provider's user-visible strings.
# Per decision D43 + docs/design/03-commands.md §3.4. Every key listed
# here mirrors a constant in BundleKeys.java; BundleLoaderTest iterates
# BundleKeys via reflection and asserts each constant resolves to a
# non-empty string in EVERY loaded bundle (M1-060 bilateral widening),
# and asserts each bundle's own keyset equals en's minus the deliberate
# en-only test.fallback.probe (M1-475). That probe must NOT be added here.
#
# UTF-8 encoded; BundleLoader wraps the InputStream in an
# InputStreamReader(UTF-8) so Cyrillic ships as-is. This is the first
# non-Latin bundle, so a load path decoding through ISO-8859-1 would turn
# every value in it into mojibake rather than mangling the occasional
# diacritic; BundleLoaderTest.twoArgAccessorReturnsCyrillicRoundtripped is
# the guard.
#
# Cyrillic is also what makes TranslationPipeline's failure condition (d)
# reachable (llm.md §Failure handling): a translator that answers a
# ru-scope request in English is caught by the target-script check, whose
# expected script is declared for `ru` on the LanguageRegistry record.
#
# MessageFormat placeholder tokens ({0}, {1}, ...) are identical to
# en.properties in position and count so the existing
# MessageFormat.format(template, args...) call sites resolve correctly
# regardless of language.
#
# No value contains an ASCII apostrophe. MessageFormat reads a single '
# as its escape character and would silently swallow the following
# placeholder, so en.properties doubles it (You''re) in the values it
# formats. Russian orthography needs none, and keeping the file free of
# them removes the whole class of error rather than tracking which values
# are formatted and which are read raw.
#
# Command tokens, flag names and placeholder arguments (<uid>, --tags,
# [--page <n>], ...) stay verbatim in English — commands are not
# translated (M1-719 out_of_scope), only the prose describing them.

