image.error.breaker_open=Backend изображений восстанавливается после сбоев. Попробуйте чуть позже.
image.error.queue_busy=Backend изображений занят — в очереди около {0} с. Попробуйте чуть позже.
image.error.queue_busy_no_eta=Backend изображений занят. Попробуйте позже.
image.error.credits_exhausted=Кредиты на изображения за этот час исчерпаны. Попробуйте позже.
image.error.cooldown=Пауза между изображениями — попробуйте снова через {0} с.
image.error.timeout=Генерация изображения превысила лимит времени, и задача была отменена. Попробуйте снова.
image.error.no_attachment_support=Этот канал не может передавать изображения, поэтому генерация здесь недоступна.
image.error.attachment_over_limit=Сгенерированное изображение превышает лимит размера этого канала. Попробуйте меньший --resolution.
image.error.generation_failed=Генерация изображения не удалась. Попробуйте снова.
image.error.send_failed=Изображение было сгенерировано, но его не удалось доставить. Попробуйте снова.
image.error.prompt_too_long=Этот prompt слишком длинный (не более {0} символов).
image.error.bad_resolution=Разрешение должно быть в формате WxH, например 1024x1024.
image.error.resolution_too_small=Это разрешение слишком маленькое (не менее примерно {0}x{1}).
image.error.resolution_too_large=Это разрешение слишком большое (не более примерно {0}x{1}).
image.error.missing_prompt=Использование: /image [--resolution WxH] <prompt> — отсутствует prompt.
