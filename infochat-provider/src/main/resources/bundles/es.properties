error.invite.bot_contact_unsupported=El adaptador `{0}` no tiene un contacto de bot que se pueda compartir.
error.invite.bot_contact_unavailable=El contacto del bot para el adaptador `{0}` no está disponible ahora mismo. Inténtalo de nuevo en breve.
error.invite.bot_contact_unknown_adapter=Adaptador `{0}` desconocido. Usa uno de estos: {1}.
# /invite pending-contacts (M1-633, D60). Bot-admin-only, DM-only roster of
# connected-but-unregistered contacts (distinct rows from failed invite-code
# attempts) on the inbound adapter, so an admin can copy the FULL contact id
# straight into /invite create --adapter <name> --contact <id>. Deliberately
