reply.summary.short.category_footer=/summary {0} para ampliar esta categoría, /summary {0} --full para ver todas sus noticias
reply.summary.short.other_footer=Aquí no hay un único tag que ampliar — usa /summary o /summary --full para la vista completa

# Intake-step splice fixed replies (M1-044b).
# Per docs/spec/security.md §Authorization model + §User ban +
# §Invite-code registration, and docs/design/03-commands.md §3.11
# Welcome messages.

error.invite.required=El acceso requiere una invitación.
error.ban.fixed=Tu acceso ha sido revocado.

# Mode 1 — DM, fresh user (just registered via invite). Probation is in
# effect; the welcome surfaces the allowed read-only commands.
reply.welcome.dm_fresh=¡Bienvenido! Ya estás registrado. Agrego noticias y publicaciones de redes sociales.\nTu cuenta está en periodo de prueba durante las próximas ~24h. Mientras dure, puedes:\n  {0}\nLa conversación libre se desbloquea automáticamente al terminar el periodo de prueba.\nYa sigues todas nuestras fuentes estándar, así que no hay nada que configurar — usa /follow-tag <topic> para enfocar tu resumen en lo que te interesa (el chat siempre busca en todo), o añade tus propias fuentes con /add-source. /help muestra todas las opciones.

# Welcome reply after a successful SimpleX bootstrap-admin claim (D50): the
# claimed contact is is_admin=true + vouched with no probation, so this
# distinct admin welcome replaces the shared probation dm_fresh (M1-624).
reply.welcome.admin_claim=¡Bienvenido! Ahora eres el administrador del bot. Agrego noticias y publicaciones de redes sociales.\nTienes acceso completo de inmediato — sin periodo de prueba, y todos los comandos, incluidas las operaciones de administración, están disponibles ya.\nYa sigues todas nuestras fuentes estándar, así que no hay nada que configurar — usa /follow-tag <topic> para enfocar tu resumen en lo que te interesa (el chat siempre busca en todo), o añade tus propias fuentes con /add-source. /help muestra todas las opciones.

