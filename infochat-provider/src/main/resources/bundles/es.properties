help.cmd.image.short=/image [--resolution|-r <WxH>] [--prompt|-p] <texto> — genera una imagen
help.cmd.image.usage=/image [--resolution|-r <WxH>] [--prompt|-p] <texto>\n\nGenera una imagen en el backend del operador y la envía aquí, mostrando el prompt en inglés realmente utilizado.\n\n  --resolution, -r  tamaño de salida opcional WxH (limitado por un tope del servidor)\n  --prompt, -p      todo lo que sigue a este indicador es el prompt, literal\n\nLas generaciones consumen un crédito horario y respetan una breve pausa; cuando la cola del backend está llena, el comando rechaza en lugar de seguir encolando.
help.cmd.image.examples=\ \ /image a red bicycle on a wicker chair\n  /image -r 1024x1024 -p a blue door in morning light
