error.summary.window_minutes_not_accepted=La ventana `-w` no acepta un sufijo de minutos. Usa h (horas), d (días) o w (semanas), por ejemplo `/summary -w 24h`.
error.summary.window_out_of_range=La ventana `-w` está fuera de rango. Permitido: 1h-168h, 1d-30d o 1w-4w.
error.summary.unknown_tag=Tag `{0}` desconocido. ¿Quisiste decir alguno de estos: {1}?
error.summary.tag_malformed=Ese tag está mal formado. Los tags deben coincidir con `[a-z0-9][a-z0-9-]` y tener como máximo 48 caracteres.

reply.summary.no_posts_yet=Todavía no hay publicaciones que resumir en esa ventana. Prueba una ventana más amplia (por ejemplo /summary -w 7d). Tu resumen cubre todas tus fuentes; usa /follow-tag <topic> para enfocarlo — o /unfollow-tag --all si lo has acotado demasiado.
reply.summary.no_subscriptions=No hay ninguna fuente visible en este ámbito — se ha dejado de seguir aquí todas las fuentes estándar y no se sigue ninguna otra. Ejecuta /follow-all-sources para recuperar las fuentes estándar.
reply.summary.degraded_notice=El LLM que genera resúmenes no está disponible; se muestran solo titulares + URL de origen + UID de publicación (sin texto).
reply.summary.partial_degraded_notice=No se han podido resumir {0} de {1} temas; esos se muestran solo como titulares + URL de origen + UID de publicación.
reply.summary.window_too_large_notice=Esta ventana contiene {0} publicaciones — más que el límite de {1} del generador de resúmenes, así que no se ha generado texto; se muestran solo titulares + URL de origen + UID de publicación. A este volumen, acotar la ventana no ayudará — prueba una etiqueta, por ejemplo /summary technology -w 2h. /get-tags lista las disponibles.
reply.summary.cap_excess_notice=Se muestran {0} de {1} publicaciones (límite: {2}={0}; {3} más antiguas excluidas).
reply.summary.top_3_of_n_prefix=Se muestran publicaciones de tus 3 tags seguidos principales (de {0} en total).

