# ----- /save + /saved + /unsave (M1-052) ----------------------------------
# Per docs/spec/commands.md §Content + docs/spec/schema.md §Per-user state +
# docs/design/02-schema.md §2.6.1 + docs/design/03-commands.md §/save /§/saved
# /§/unsave. Saves are per-user-globally (decision D13); the /saved reply
# header discloses this so a user invoking /saved in a group is not
# surprised by DM-only saves appearing. Plain text only — single backticks
# for inline literals, no markdown link syntax.

error.save.unknown_uid=No hay ninguna publicación con ese UID en el catálogo visible. Revisa el UID e inténtalo de nuevo.
error.save.cap_met=Tu biblioteca de publicaciones guardadas está llena. Usa /unsave <uid> para hacer sitio antes de guardar otra.
error.save.already_saved=Esa publicación ya está en tu biblioteca.
# Token {0} = the configured per-tag length cap.
error.save.tag_too_long=Uno de tus tags personales es demasiado largo. Cada tag está limitado a {0} caracteres.
# Token {0} = the configured per-call tag-count cap.
error.save.too_many_tags=Demasiados tags personales. Puedes asociar como máximo {0} tags a una publicación guardada.
# No token by design (M1-675): personal tags are echoed into the
# group-visible /saved reply, so reflecting the rejected tag back here
# would reintroduce the very echo the rejection exists to prevent.
error.save.tag_invalid=Los tags personales no pueden contener una barra. No se ha guardado nada — quita la barra e inténtalo de nuevo.
# Each /save /saved /unsave command gets its own group-scope key so T2-F
# can independently translate them when the SPI widens to carry the
# group actor's identity.
error.save.group_not_in_v1=/save no está disponible en ámbito de grupo en la v1. Ejecútalo en un mensaje directo al bot.
# Token {0} = the post UID the caller saved.
reply.save.success=`{0}` guardado.

# Token {0} = displayed-count, {1} = total-count, {2} = current page, {3} = total pages, {4} = filter clause (e.g. `, filter: ai` or empty).
reply.saved.header.global=Publicaciones guardadas ({0} de {1} en total — los guardados son globales entre DM y grupos, página {2}/{3}{4}):
# Token {0} = post UID, {1} = headline, {2} = saved_at relative (e.g. `2d ago`), {3} = tag list (comma-joined).
reply.saved.line=- [{0}] {1} — guardado {2} — tags: {3}
# Same line for a save with no renderable headline at all: the token AND the
# separator that would have followed it are both gone, so the placeholders
# shift down by one. Token {0} = post UID, {1} = saved_at relative, {2} = tags.
reply.saved.line.no-headline=- [{0}] — guardado {1} — tags: {2}
reply.saved.empty=Todavía no hay publicaciones guardadas. Prueba /save <uid> desde una respuesta de /summary.
reply.saved.age.days=hace {0} d
reply.saved.age.hours=hace {0} h
reply.saved.age.minutes=hace {0} min
error.saved.group_not_in_v1=/saved no está disponible en ámbito de grupo en la v1. Ejecútalo en un mensaje directo al bot.

error.unsave.unknown_uid=Esa publicación no está en tu biblioteca. No hay nada que quitar.
# Token {0} = the post UID the caller removed.
reply.unsave.success=`{0}` quitado de tu biblioteca.
error.unsave.group_not_in_v1=/unsave no está disponible en ámbito de grupo en la v1. Ejecútalo en un mensaje directo al bot.

