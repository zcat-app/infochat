error.invite.banned_target=Ese contacto está bloqueado. Usa /unban primero si vas a readmitirlo.
error.invite.open_cap_met=Se ha alcanzado el límite de invitaciones --open por adaptador. Revoca un código abierto existente con /invite revoke antes de crear otro.
error.invite.contact_cap_met=Se ha alcanzado el límite global de invitaciones --contact. Revoca un código vinculado a contacto existente con /invite revoke antes de crear otro.
error.invite.revoke_not_pending=Ese código de invitación no está en estado PENDING. No se ha hecho nada.

reply.invite.created=Código de invitación: `{0}` (un solo uso).
reply.invite.list_header=Códigos de invitación pendientes:
