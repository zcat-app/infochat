# ----- Asset command reply layout (M1-055c) ---------------------------------
# Per docs/spec/commands.md §Asset commands + docs/design/10-asset-commands.md
# §10.5 Reply layout. Plain text only — bare URLs per D30, no markdown link
# syntax, no supportsCodeFormatting/supportsMarkdownLinks branch.
# The renderer silently omits absent snapshot fields (never invents zeros).
# Token {0} = display name, {1} = source name.
reply.asset.header={0} ({1})
# Token {0} = formatted price. Leading two spaces escaped (\ ) so Properties.load
# keeps the §10.5 indent — an unescaped value loses it, flush-aligning the line (M1-628).
reply.asset.price_line=\ \ {0}
# Token {0} = signed percentage (e.g. +0.3% or −2.4%). Leading two spaces
# escaped (\ ) so Properties.load keeps the §10.5 indent (M1-628).
reply.asset.delta_1h=\ \ 1h:    {0}
# Token {0} = signed percentage. Carries the delta line only: the 24h delta and
# the 24h spread are independent facts a degraded upstream can return one of, so
# folding both into this key silently dropped a delta that arrived without a
# spread (M1-678). Leading two spaces escaped (\ ) so Properties.load keeps the
# §10.5 indent (M1-628).
reply.asset.delta_24h=\ \ 24h:   {0}
# Token {0} = high, {1} = low. The sole spread emitter for every source (M1-678);
# where the snapshot also carries a 24h delta, that line is emitted above this
# one. High/low on their own lines so the reply does not wrap mid-parenthetical
# on a phone (M1-592). The first line's leading space is escaped (\ ) because
# Properties.load strips a value's leading whitespace — without the escape the
# first line would lose the 2-space indent the wrapped line keeps, misaligning
# the block.
reply.asset.spread=\ \ máx. 24h: {0}\n  mín. 24h: {1}
# Token {0} = UTC time string, {1} = cache age in seconds. Leading two spaces
# escaped (\ ) so Properties.load keeps the §10.5 indent (M1-628).
reply.asset.capture_line=\ \ a fecha de {0}, en caché {1}s
# Stale marker — appended to the header line.
reply.asset.stale_marker=  ⚠ desactualizado
# Attribution source label (M1-303). The renderer owns the line indent and the
# separator space; this value is just the translatable word + colon.
reply.asset.source_label=fuente:

