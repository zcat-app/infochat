help.cmd.add-source.usage=/add-source <url> --tags <tag>[,<tag>...] [--type <kind>] [--category <cat>] [--name <name>] [--lang <code>]\n\nRegistra una fuente para que sus publicaciones entren en el proceso de ingesta.\n\n  <url>             la URL de la fuente\n  --tags <csv>      obligatorio — al menos un tag del vocabulario controlado\n  --type <kind>     opcional — tipo de fuente, por ejemplo rss\n  --category <cat>  opcional — news, blog o social (news por defecto)\n  --name <name>     opcional — nombre alternativo para mostrar\n  --lang <code>     opcional — idioma declarado de la fuente, en o cs (en por defecto)
