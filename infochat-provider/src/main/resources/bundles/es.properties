help.cmd.invite.usage=/invite create|list|revoke|bot-contact|pending-contacts\n\nGestiona los códigos de invitación de DM y el contacto de conexión del bot. Solo en DM.\n\n  create --adapter <name> --contact <id>  emite un código para un contacto concreto\n  create --adapter <name> --open          emite un código abierto (pide confirmación)\n  list [--page <n>]                       lista los códigos emitidos (20 por página)\n  revoke <code>                           revoca un código pendiente (pide confirmación)\n  bot-contact [--adapter <name>]          muestra el contacto de conexión del bot para el alta\n  pending-contacts [--page <n>]           lista los contactos conectados sin registrar para vincular con --contact
