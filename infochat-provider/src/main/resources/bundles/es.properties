# ----- Conceptual topic corpus (M1-649, D68) -------------------------------
# Per docs/spec/commands.md §Chat mode + decision D68. The corpus lives in
# HelpTopicCorpus (one intent-shaped match doc per topic, indexed under
# doc_kind='topic'); these keys are the SERVED answers — reviewed product
# copy, plain text (D30), bundle-localized (D43), bypassing TranslationPipeline
# (the D43 two-path rule, same as D67's deterministic usage block). Naming:
# topic.<slug>.answer mirrors the topic's HelpTopicCorpus slug. Delivery is
# M1-666; M1-649 ships retrieval only.
topic.getting-access.answer=infochat funciona solo por invitación. Un administrador te da un código de invitación de un solo uso; envía ese código al bot como tu primer mensaje directo y quedarás registrado y recibirás la bienvenida. Las cuentas nuevas empiezan en un periodo de prueba breve, con un conjunto reducido de comandos y el modo chat desactivado — es normal y temporal. El acceso completo se desbloquea al terminar el periodo de prueba, o antes si un administrador te avala. Ejecuta /help en cualquier momento para ver exactamente qué puedes hacer ahora.
topic.probation.answer=El periodo de prueba es una fase de inicio lento por la que pasa toda cuenta nueva. Durante las primeras 24h tras registrarte (según el ajuste del periodo de prueba del despliegue) dispones de un conjunto reducido de comandos y el modo chat está desactivado — solo funcionan los comandos de catálogo de solo lectura más /lang, /forget y /stop. Cuando termina el periodo de prueba obtienes el conjunto completo de comandos y se desbloquea el modo chat. Un administrador también puede finalizarlo antes avalándote. El mensaje de bienvenida y /help muestran la ventana del periodo de prueba y exactamente qué comandos están disponibles.
topic.chat-vs-commands.answer=Puedes hablar con el bot de dos formas. Los comandos empiezan por barra — como /summary, /save, /follow-tag — y ejecutan acciones exactas y repetibles. Cualquier otra cosa es una pregunta de chat en lenguaje natural, útil para hacer seguimiento y explorar. Puedes mezclar ambas libremente en la misma conversación. El bot responde en texto plano; los enlaces aparecen como direcciones web simples que puedes tocar o copiar.
topic.chat-assistant-boundary.answer=El asistente de chat es de solo lectura. Busca y explica tus noticias; nunca puede cambiar ajustes, publicar nada ni actuar como administrador. Solo ve tus propias suscripciones y el ámbito en el que estás conversando — no puede acceder a los datos de otro usuario ni a otra conversación. Si una respuesta tarda demasiado, /stop la cancela.
topic.dm-vs-group.answer=infochat funciona tanto en DM como en grupos. En un DM, basta con escribir al bot para recibir respuesta. En un grupo, menciónalo con @ — o espera a sus boletines programados de la mañana y de la tarde. Los ajustes de todo el grupo (idioma, horarios del boletín, las fuentes del grupo) los gestionan los administradores del grupo, pero tu contexto personal y tus guardados son siempre tuyos y nunca se comparten con los demás miembros. Los grupos aprobados reciben además boletines automáticos con las publicaciones más recientes.
topic.unfollow-vs-delete.answer=/unfollow-source <id> solo hace que la fuente deje de aparecer en tu ámbito (solo para ti en un DM, o para todo el grupo cuando actúa allí un administrador del grupo). La fuente en sí permanece — otros ámbitos la siguen viendo y sus publicaciones les siguen llegando. Eliminar una fuente por completo (quitarla del despliegue) es una acción de administrador del bot — pide a un administrador que lo haga si una fuente compartida debe desaparecer. Es decir: dejar de seguir es por ámbito y reversible; eliminar es global, permanente y solo para administradores.
topic.add-source-requires-tags.answer=/add-source exige al menos un valor en --tags porque toda publicación debe poder ordenarse por tema, y el etiquetado automático puede fallar. Al asociar al menos un tag al añadir la fuente, garantizas que sus publicaciones puedan seguir dirigiéndose a los boletines y a /summary aunque el etiquetador automático no tenga nada seguro que decir. Los tags fijados al añadir la fuente pasan a ser además los tags de arranque compartidos de la fuente — visibles para todo el que la siga — así que elígelos con eso en mente. Usa /follow-tag (tu vista personal) para ajustar lo que ves tú.
topic.personal-vs-shared-tags.answer=Hay dos capas de tags. Cada fuente lleva tags de arranque compartidos, fijados al añadirla y modificables solo por un administrador del bot — afectan a todo el que siga esa fuente. Encima de eso, cada usuario tiene sus selecciones personales de /follow-tag, que ajustan solo su propia vista: por defecto ves todo lo de tus fuentes, y en cuanto haces /follow-tag de un tema pasas a "solo los temas que he elegido" (solo para ti, en este ámbito). /unfollow-tag quita un tema; /unfollow-tag --all te devuelve a la vista por defecto con todo lo de tus fuentes.
topic.clear-vs-forget.answer=/clear y /forget borran datos de conversación, pero con alcances distintos. /clear descarta solo el contexto a corto plazo de la conversación actual — tu memoria a más largo plazo y tus publicaciones guardadas permanecen. /forget es el borrado total de privacidad: elimina todo lo que el bot conserva en tu nombre en este ámbito (memoria del chat, la conversación actual y tu biblioteca de publicaciones guardadas — los guardados son globales, así que se borran ejecutes /forget en la conversación que sea). /clear es reversible: el bot reconstruye el contexto según conversas. /forget es irreversible y pide confirmación antes.
topic.forget-erasure.answer=/forget borra, en el ámbito donde lo ejecutas: tu memoria de chat (registros chat_memory de esta conversación), tus sesiones de chat y sus mensajes (registros chat_session y chat_message de esta conversación) y tus anclas personales de resumen (registros summary_anchor marcados como personales para esta conversación). También elimina tu biblioteca de publicaciones guardadas de forma global — los registros saved_post de tu usuario, en todos los ámbitos, porque los guardados son globales según la decisión D13. /forget NO toca: tu estado de bloqueo o de administrador, tus membresías de grupo ni el registro de auditoría a prueba de manipulaciones del sistema (que anota que ocurrieron acciones, nunca el contenido de tus mensajes). Te avisa si todavía tienes datos en otras conversaciones para que puedas borrarlas también.

