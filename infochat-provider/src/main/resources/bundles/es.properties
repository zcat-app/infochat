help.cmd.summary.usage=/summary [tag] [-w <duration>] [--short|--full|--flat]\n\nUn resumen de las publicaciones recientes de las fuentes que sigues.\n\n  [tag]          opcional — limita el resumen a un tag\n  -w <duration>  ventana temporal: 1h-168h, 1d-30d, 1w-4w (24h por defecto; no se aceptan minutos)\n  --short        una línea de recapitulación por categoría (el vistazo rápido; sin texto por noticia)\n  --full         todas las noticias agrupadas bajo encabezados de categoría (sin límite por categoría)\n  --flat         un bloque detallado por noticia (la forma plana por grupo)\n\nSin ninguna opción, las publicaciones se agrupan bajo encabezados de categoría con un límite por categoría (el valor legible por defecto). Las tres opciones de formato son mutuamente excluyentes.
help.cmd.summary.examples=\ \ /summary\n  /summary -w 7d\n  /summary ai -w 30d
help.cmd.list-sources.usage=/list-sources [--page <n>]\n\nLista las fuentes a las que está suscrito este ámbito.\n\n  --page <n>  pagina las listas largas (20 por página)
help.cmd.list-sources.usage.admin=\ \ --all              todas las fuentes del despliegue, no solo las de este ámbito\n  --include-deleted  con --all: incluye las fuentes eliminadas de forma reversible
help.cmd.list-sources.examples=\ \ /list-sources\n  /list-sources --page 2
help.cmd.save.usage=/save <uid> [-t <tag>[,<tag>...]]\n\nGuarda una publicación en tu biblioteca (tus guardados se comparten entre todos tus ámbitos).\n\n  <uid>                el uid de la publicación que aparece en resúmenes y boletines\n  -t <tag>[,<tag>...]  opcional — añade tags personales (libres, hasta 20)
help.cmd.save.examples=\ \ /save 3f9c2a\n  /save 3f9c2a -t research,privacy
help.cmd.saved.usage=/saved [tag] [-w <duration>] [--page <n>]\n\nLista tus publicaciones guardadas (los guardados son por usuario, en todos los ámbitos).\n\n  [tag]          opcional — solo los guardados con este tag personal\n  -w <duration>  opcional — solo los guardados de las últimas <N>h, <N>d o <N>w\n  --page <n>     pagina las listas largas (20 por página)
help.cmd.saved.examples=\ \ /saved\n  /saved research -w 30d
help.cmd.unsave.usage=/unsave <uid>\n\nQuita una publicación de tu biblioteca.\n\n  <uid>  el uid de la publicación que muestra /saved
