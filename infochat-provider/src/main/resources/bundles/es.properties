# ----- /help <command> per-command detail (M1-573) --------------------------
# Two keys per catalogue command: .usage = signature line + blank line +
# one-line description [+ blank line + indented argument/flag lines];
# .examples = indented example invocations. Command tokens, flag names and
# placeholder tokens (<uid>, [--page <n>], ...) stay verbatim across
