# Deterministic English bundle for Provider's user-visible strings.
# Per decision D43 + docs/design/03-commands.md §3.4. Every key listed
# here is mirrored by a constant in BundleKeys.java; BundleLoaderTest
# iterates BundleKeys via reflection and asserts each constant
# resolves to a non-empty string in this file. T2-C adds cs.properties
# with the same key set.

help.header.dm-user=Available commands:
help.header.group=Available commands in this group:
help.footer.probation=You are in slow-start probation. The commands above are everything available until probation ends; fuller access and free-form chat-mode replies unlock then.
help.cmd.help.short=/help — list available commands
help.cmd.add-source.short=/add-source <url> --tags <tag>[,<tag>...] — register a feed
help.cmd.summary.short=/summary [--since <duration>] [--tag <tag>] — summarize recent posts
help.cmd.status.short=/status — show runtime status
help.cmd.get-tags.short=/get-tags — list the controlled vocabulary, marking tags followed in this scope
help.cmd.get-sources.short=/get-sources — list the sources this scope is subscribed to (alias of /list-sources)
help.cmd.list-sources.short=/list-sources — list the sources this scope is subscribed to
help.cmd.save.short=/save <uid> [-t <tag>[,<tag>...]] — bookmark a post to your library
help.cmd.saved.short=/saved [tag] [-w <duration>] [--page <n>] — list your saved posts (saves are per-user, across all scopes)
help.cmd.unsave.short=/unsave <uid> — remove a post from your library
help.cmd.export.short=/export — export the data kept on your behalf
help.cmd.follow-tag.short=/follow-tag <tag> — follow a tag in this scope
help.cmd.unfollow-tag.short=/unfollow-tag <tag>|--all — unfollow a tag (or all) in this scope
help.cmd.lang.short=/lang <code> — set this scope's reply language
help.cmd.clear.short=/clear — wipe this scope's active chat context (requires confirm)
help.cmd.compress.short=/compress — checkpoint and truncate this scope's chat context
help.cmd.forget.short=/forget — purge everything kept on your behalf (requires confirm)
help.cmd.stop.short=/stop — cancel your in-flight request in this scope
help.cmd.retry.short=/retry — regenerate the prose for your last summary
help.cmd.group-timezone.short=/group-timezone <iana-zone> — set this group's timezone for digests
help.cmd.digest.short=/digest on|off — pause or resume this group's periodic digest
help.cmd.grant-admin.short=/grant-admin <contact> — grant bot-admin to a user
help.cmd.revoke-admin.short=/revoke-admin <contact> — revoke bot-admin from a user
help.cmd.ban.short=/ban <contact> — ban a user (requires confirm)
help.cmd.unban.short=/unban <contact> — lift a user's ban
help.cmd.promote.short=/promote <contact> — make a member the group admin
help.cmd.demote.short=/demote <contact> — remove a member's group-admin role
help.cmd.vouch.short=/vouch <contact> — clear a user's slow-start probation
help.cmd.invite.short=/invite create|list|revoke — manage DM invite codes
help.cmd.quarantine.short=/quarantine list|approve|reject — review quarantined posts
help.cmd.audit.short=/audit [--actor <c>] [--action <a>] [--page <n>] — read the audit log
help.cmd.remove-source.short=/remove-source <id> — remove a source (requires confirm)
help.cmd.source-enable.short=/source-enable <id> — re-enable a failed or disabled source
help.cmd.source-disable.short=/source-disable <id> — disable an active source
help.cmd.approve-group.short=/approve-group <id> — approve a pending group
help.cmd.reject-group.short=/reject-group <id> — reject a group (requires confirm)
help.cmd.list-groups.short=/list-groups [--page <n>] — list known groups

