# Welcome messages.

error.invite.required=Access requires an invitation.
error.ban.fixed=Your access has been revoked.

# Mode 1 — DM, fresh user (just registered via invite). Probation is in
# effect; the welcome surfaces the allowed read-only commands.
reply.welcome.dm_fresh=Welcome! You''re registered. I aggregate news and social posts.\nYour account is in the probation period for the next ~24h. While probation is on, you can:\n  {0}\nFree-form chat unlocks automatically when probation ends.\nYou''re already following all our standard sources, so there''s nothing to set up — use /follow-tag <topic> to focus your digest on what you care about (chat always searches everything), or add your own sources with /add-source. /help shows the full surface.

# Welcome reply after a successful SimpleX bootstrap-admin claim (D50): the
# claimed contact is is_admin=true + vouched with no probation, so this
# distinct admin welcome replaces the shared probation dm_fresh (M1-624).
# No {0} placeholder — sent via raw bundleLoader.get, so apostrophes are
# single (not MessageFormat-escaped like dm_fresh above).
reply.welcome.admin_claim=Welcome! You're now the bot administrator. I aggregate news and social posts.\nYou have full access immediately — no probation window, and every command including the admin operations is available now.\nYou're already following all our standard sources, so there's nothing to set up — use /follow-tag <topic> to focus your digest on what you care about (chat always searches everything), or add your own sources with /add-source. /help shows the full surface.

