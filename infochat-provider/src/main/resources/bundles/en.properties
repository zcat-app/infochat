# Deterministic English bundle for Provider's user-visible strings.
# Per decision D43 + docs/design/03-commands.md §3.4. Every key listed
# here is mirrored by a constant in BundleKeys.java; BundleLoaderTest
# iterates BundleKeys via reflection and asserts each constant
# resolves to a non-empty string in this file. T2-C adds cs.properties
# with the same key set.

help.header.dm-user=Available commands:
help.cmd.help.short=/help — list available commands
help.cmd.add-source.short=/add-source <url> --tags <tag>[,<tag>...] — register a feed
help.cmd.summary.short=/summary [--since <duration>] [--tag <tag>] — summarize recent posts

error.unknown_command=Unknown command. Try /help for the available commands.
error.internal=Something went wrong handling that message. Please try again.

chat_mode.not_in_mvp=Chat-mode replies are not in the MVP; try /help for the available commands.

# /add-source friendly errors (M1-036).
# Plain text only — single backticks for inline literals, bare URLs,
# no markdown link syntax (decision D30 + CLAUDE.md §Key conventions).
# {0}/{1} interpolation tokens are filled via java.text.MessageFormat.

error.add_source.tags_required=Please supply at least one tag: /add-source <url> --tags <tag>[,<tag>...]
error.add_source.unknown_kind=Unknown source type `{0}`. Valid types: {1}.
error.add_source.unknown_category=Unknown category `{0}`. Valid categories: {1}.
error.add_source.malformed_url=That URL looks malformed. Expected a fully-qualified http:// or https:// URL (or wss:// for a Nostr relay).
error.add_source.url_unreachable=Couldn't reach that URL right now (HTTP error response). Try again, or check the URL.
error.add_source.url_blocked_ssrf=That URL points to a non-public address and is blocked for safety.
error.add_source.url_timeout=Timed out reaching that URL. Try again, or check the URL.
error.add_source.ambiguous_url=Couldn't infer the source type from that URL. Please supply an explicit --type (rss, bluesky, reddit, youtube, odysee, nostr).
error.add_source.banned=You are not permitted to add sources.
error.add_source.group_admin_only=Only group admins can add sources to a group.

# /add-source successful replies (M1-036).

reply.add_source.fresh_insert=Source `{0}` added.
reply.add_source.subscribed_existing=Subscribed. (Source already existed; supplied tags were ignored.)
reply.add_source.admin_tags_replaced=Source already existed; bootstrap tags replaced.
reply.add_source.url_visibility_disclosure=Note: source URLs are global state and are visible to bot admins via `/list-sources --all`.

# /summary friendly errors + replies (M1-037).
# Per docs/spec/commands.md §Content (`/summary`) +
# docs/design/03-commands.md §Time window flag.

error.summary.window_minutes_not_accepted=The `-w` window does not accept a minutes suffix. Use h (hours), d (days), or w (weeks), e.g. `/summary -w 24h`.
error.summary.window_out_of_range=The `-w` window is out of range. Allowed: 1h-168h, 1d-30d, or 1w-4w.
error.summary.unknown_tag=Unknown tag `{0}`. Did you mean one of: {1}?
error.summary.tag_malformed=That tag is malformed. Tags must match `[a-z0-9][a-z0-9-]` and be at most 48 characters.

reply.summary.no_posts_yet=No posts to summarize yet for that window.
reply.summary.degraded_notice=Summarizer LLM is unreachable; showing headlines + source URLs + post UIDs only (no prose).
reply.summary.cap_excess_notice=Showing {0} of {1} posts (cap: {2}={0}; {3} oldest excluded).
reply.summary.top_3_of_n_prefix=Showing posts from your top 3 followed tags (of {0} total).

# Intake-step splice fixed replies (M1-044b).
# Per docs/spec/security.md §Authorization model + §User ban +
# §Invite-code registration, and docs/design/03-commands.md §3.11
# Welcome messages.

error.invite.required=Access requires an invitation.
error.ban.fixed=Your access has been revoked.

# Mode 1 — DM, fresh user (just registered via invite). Probation is in
# effect; the welcome surfaces the allowed read-only commands.
reply.welcome.dm_fresh=Welcome! You're registered. I aggregate news and social posts.\nYour account is in the probation period for the next ~24h. While probation is on, you can:\n  /help, /status, /summary, /saved, /list-sources, /get-tags, /export, /forget, /lang, /zcash, /monero\nFree-form chat unlocks automatically when probation ends.\nTry /summary -w 24h once a few sources are configured, or /help to see the full surface.

# Mode 3 — Group, first @mention by a specific user.
reply.welcome.group_first_mention=Hi! I'm in this group as a news/social aggregator.\nRun /help here to see what you can do. Your account is in a brief probation window; full access opens automatically.\n(Group admins can /add-source and /follow-tag to curate the feed for everyone in this group.)

# Admin command handler errors + replies (M1-044c).
# Per docs/spec/security.md §User ban + §Invite-code registration +
# §Authorization model, and docs/spec/commands.md §Admin (bot admin).
# {0}/{1} interpolation tokens are filled via java.text.MessageFormat.

error.admin_only=That command is bot-admin-only.
error.contact_not_registered=That contact is not registered. No action taken.
error.ban.cannot_ban_self=You cannot ban yourself.
error.ban.last_admin=Cannot ban the only remaining bot admin. Grant another admin first with /grant-admin.

reply.ban.success=Banned `{0}`.

# Non-preban /unban path with zero group-admin rows restored.
reply.unban.plain=User unbanned.

# Preban /unban path. The literals `pre-ban-only row removed` and `fresh invite required`
# are asserted by acceptance item 34 + spec §User ban (commands.md §Admin /unban).
reply.unban.preban_deleted=The pre-ban-only row removed. A fresh invite required for DM.

# Non-preban /unban path that restored one or more group-admin rows.
# {0} = comma-joined group display names. The literal `/demote` is the
# spec-required override hint (security.md §User ban, commands.md §Admin /unban).
reply.unban.group_admins_restored=User unbanned. Restored group-admin in: {0}. If this was unintended, use /demote <contact> in the affected group(s).

error.invite.unknown_subcommand=Unknown /invite subcommand. Use one of: /invite create, /invite list, /invite revoke.
error.invite.missing_flag=Please supply exactly one of --contact <id> or --open.
error.invite.mutually_exclusive=--contact and --open are mutually exclusive. Supply only one.
error.invite.unknown_adapter=Unknown adapter `{0}`. Use one of the currently-enabled adapters.
error.invite.banned_target=That contact is banned. Use /unban first if reinstating.
error.invite.open_cap_met=The per-adapter --open invite cap is met. Revoke an existing open code with /invite revoke before creating another.
error.invite.contact_cap_met=The global --contact invite cap is met. Revoke an existing contact-bound code with /invite revoke before creating another.
error.invite.revoke_not_pending=That invite code is not in PENDING state. No action taken.

reply.invite.created=Invite code: `{0}` (single use).
reply.invite.list_header=Pending invite codes:
# Per-row template for CONTACT_BOUND rows. Tokens: {0}=code prefix, {1}=adapter, {2}=contact id, {3}=ISO expiry.
reply.invite.list_entry=`{0}` · adapter={1} · target={2} · expires={3}
# Per-row template for OPEN_ADAPTER rows. The literal OPEN marker is asserted by
# acceptance item 19 (spec §Invite-code registration: list output must visually
# distinguish --open codes from --contact codes). Tokens: {0}=code prefix,
# {1}=adapter, {2}=ISO expiry.
reply.invite.list_entry_open=`{0}` · adapter={1} · target=OPEN · expires={2}
reply.invite.revoked=Invite code revoked.

# ----- Pre-dispatch confirm gate (M1-051) -----------------------------------
# Per docs/spec/commands.md §Surface conventions + docs/design/03-commands.md
# §Confirmation for destructive commands. Plain text only — single backticks
# for inline literals.
error.confirm.no_pending=No pending confirmation to confirm. Issue the original command first.
# Token {0} = display name of the cancelled command (e.g. `ban`).
reply.confirm.cancelled=Pending `{0}` cancelled.
# Token {0} = timeout in whole seconds, {1} = redacted target contact id.
reply.confirm.prompt.ban=About to ban `{1}`. Reply `/ban confirm` within {0}s to proceed; any other input cancels.
# Token {0} = timeout in whole seconds, {1} = target adapter name.
reply.confirm.prompt.invite_create_open=About to mint an OPEN invite for adapter `{1}`. Reply `/invite create --open confirm` within {0}s to proceed; any other input cancels.
# Token {0} = timeout in whole seconds, {1} = 8-char code prefix.
reply.confirm.prompt.invite_revoke=About to revoke invite `{1}`. Reply `/invite revoke confirm` within {0}s to proceed; any other input cancels.

# ----- Slow-start probation + /vouch (M1-045) ---------------------------
# Per docs/spec/security.md §Slow-start tier + docs/design/03-commands.md §3.3.
# Plain text only — single backticks for inline literals.
# Token {0} = approximate time until full access unlocks (e.g. `~12h`).
error.probation.blocked=You are still in slow-start probation. Full access unlocks in {0}. Allowed during probation: /help, /status, /summary, /saved, /get-tags, /get-sources, /list-sources, /export, /forget, /lang, /stop.
reply.vouch.success=User vouched. Probation cleared.
reply.vouch.noop=Nothing to do — that user is already past probation.
# M1-045 redteam-fix: /vouch refuses to advance a banned user past probation
# (intake step 4 still blocks them, so /vouch would silently strand state).
error.vouch.banned_target=That contact is banned. Use /unban first to reinstate.

# ----- /grant-admin + /revoke-admin (M1-046) --------------------------------
# Per docs/spec/security.md §Authorization model + §Per-adapter admin threat
# profile + docs/spec/commands.md §Admin (bot admin). Plain text only — single
# backticks for inline literals, no markdown link syntax.

error.grant_admin.banned_target=That contact is banned. Use /unban first if reinstating.
error.grant_admin.already_admin=That contact is already a bot admin. No action taken.
# Token {0} = redacted target contact id.
reply.grant_admin.success=Granted bot-admin to `{0}` on this adapter.

error.revoke_admin.cannot_revoke_self=You cannot revoke your own bot-admin tier.
error.revoke_admin.not_admin=That contact is not a bot admin. No action taken.
# Mentions the global last-admin invariant + the hint to grant another admin first
# (the spec's operator-friendly reply per security.md §Authorization model).
error.revoke_admin.last_admin=Cannot revoke the only remaining bot admin across the deployment. Grant another admin first with /grant-admin.
# Token {0} = redacted target contact id.
reply.revoke_admin.success=Revoked bot-admin from `{0}` on this adapter.

# Shared group-scope reject for /grant-admin and /revoke-admin (DM-only in v1).
error.group_admin_not_in_v1=That command is not available in group scope in v1. Run it in a direct message to the bot.
