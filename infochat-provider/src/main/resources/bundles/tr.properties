help.cmd.unfollow-tag.usage=/unfollow-tag <tag>|--all\n\nBu kapsamda bir etiketin (veya tüm etiketlerin) takibini bırakır.\n\n  <tag>  şu anda takip edilen bir etiket\n  --all  bu kapsamdaki her etiketin takibini bırakır (onay ister)
