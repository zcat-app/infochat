# Deterministic Turkish bundle for Provider's user-visible strings.
# Per decision D43 + docs/design/03-commands.md §3.4. Every key listed
# here mirrors a constant in BundleKeys.java; BundleLoaderTest iterates
# BundleKeys via reflection and asserts each constant resolves to a
# non-empty string in EVERY loaded bundle (M1-060 bilateral widening),
# and separately asserts this file's own keyset equals en's minus the
# deliberate en-only test.fallback.probe.
#
# UTF-8 encoded; BundleLoader wraps the InputStream in an
# InputStreamReader(UTF-8) so the Turkish letters (ç, ğ, ı, İ, ö, ş, ü)
# ship as-is. MessageFormat placeholder tokens ({0}, {1}, ...) are
# identical to en.properties in COUNT so the existing
# MessageFormat.format(template, args...) call sites resolve correctly;
# their ORDER may differ where Turkish word order requires it, which is
# safe because MessageFormat resolves by index, not by position.
#
# NO LITERAL APOSTROPHE appears in any value, deliberately. A value used
# as a MessageFormat pattern treats ' as the quoting character, so a
# Turkish suffix apostrophe (the "infochat'e" form) would silently
# swallow the rest of the pattern including its placeholders. Turkish
# needs the apostrophe only to attach a suffix to a proper noun, and
# every value here is worded to avoid that — keep it that way when
# adding keys.
#
# Turkish takes no plural agreement after a numeral (1 kaynak, 5 kaynak),
# so en's {0,choice,...} plural forms collapse to a bare {0} plus a
# singular noun. The placeholder still consumes its argument, so no call
# site changes.

