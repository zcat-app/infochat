# ----- Conceptual topic corpus (M1-649, D68) -------------------------------
# The SERVED answers — reviewed product copy, plain text (D30),
# bundle-localized (D43), bypassing TranslationPipeline (the D43 two-path
# rule). topic.<slug>.answer mirrors the topic's HelpTopicCorpus slug.
# No answer may name a BOT_ADMIN-tier command (HelpTopicCorpusTest pins this
# for en/cs); the Turkish copy holds the same line.
topic.getting-access.answer=infochat yalnızca davetle çalışır. Bir yönetici size tek kullanımlık bir davet kodu verir; bu kodu bota ilk doğrudan mesajınız olarak gönderdiğinizde kaydınız yapılır ve karşılanırsınız. Yeni hesaplar kısa bir deneme süreciyle başlar: sınırlı bir komut kümesi ve kapalı sohbet modu — bu normaldir ve geçicidir. Deneme süreci bitince ya da bir yönetici sizin için kefil olunca tam erişim açılır. Şu anda tam olarak neler yapabileceğinizi görmek için istediğiniz zaman /help çalıştırın.
topic.probation.answer=Deneme süreci, her yeni hesabın geçtiği bir yavaş başlangıç aşamasıdır. Kaydolduktan sonraki ilk 24h boyunca (dağıtımın infochat.probation.duration ayarına göre) sınırlı bir komut kümesi alırsınız ve sohbet modu kapalıdır — yalnızca salt okunur katalog komutları ile /lang, /forget ve /stop çalışır. Deneme süreci bitince tam komut kümesini alırsınız ve sohbet modu açılır. Bir yönetici sizin için kefil olarak denemeyi erkenden de bitirebilir. Karşılama mesajı ve /help, deneme aralığını ve tam olarak hangi komutların kullanılabilir olduğunu gösterir.
topic.chat-vs-commands.answer=Botla iki şekilde konuşabilirsiniz. Komutlar eğik çizgiyle başlar — /summary, /save, /follow-tag gibi — ve tam, yinelenebilir işlemler yapar. Bunun dışındaki her şey düz dille sorulan bir sohbet sorusudur; ek sorular sormak ve keşfetmek için uygundur. İkisini aynı konuşmada özgürce karıştırabilirsiniz. Bot düz metinle yanıtlar; bağlantılar dokunabileceğiniz ya da kopyalayabileceğiniz çıplak web adresleri olarak görünür.
topic.chat-assistant-boundary.answer=Sohbet yardımcısı salt okunurdur. Haberlerinizi arar ve açıklar; hiçbir zaman ayar değiştiremez, bir şey paylaşamaz ya da yönetici gibi davranamaz. Yalnızca kendi aboneliklerinizi ve içinde sohbet ettiğiniz kapsamı görür — başka bir kullanıcının verilerine ya da başka bir konuşmaya erişemez. Bir yanıt çok uzun sürüyorsa /stop onu iptal eder.
topic.dm-vs-group.answer=infochat hem doğrudan mesajlarda hem gruplarda çalışır. Bir DM içinde bota mesaj göndermeniz yanıt almak için yeterlidir. Bir grupta ise botu @mention edin — ya da zamanlanmış sabah ve akşam bültenlerini bekleyin. Grup geneli ayarları (dil, bülten saatleri, grubun kaynakları) grup yöneticileri yönetir, ama kişisel bağlamınız ve kayıtlarınız her zaman size aittir ve diğer grup üyeleriyle paylaşılmaz. Onaylı gruplar ayrıca en son gönderilerin otomatik bültenlerini alır.
topic.unfollow-vs-delete.answer=/unfollow-source <id> yalnızca kaynağın sizin kapsamınızda görünmesini durdurur (DM içinde yalnızca siz, bir grup yöneticisi grupta çalıştırdığında ise tüm grup). Kaynağın kendisi kalır — diğer kapsamlar onu görmeyi sürdürür ve gönderileri onlara ulaşmaya devam eder. Bir kaynağı tümüyle silmek (dağıtımdan kaldırmak) bir bot yöneticisi işlemidir — paylaşılan bir kaynak kaldırılmalıysa bir yöneticiye danışın. Yani: takibi bırakmak kapsama özeldir ve geri alınabilir; silmek geneldir, kalıcıdır ve yalnızca yöneticilere açıktır.
topic.add-source-requires-tags.answer=/add-source en az bir --tags değeri ister, çünkü her gönderi konuya göre sıralanabilmeli ve otomatik etiketleme yanılabilir. Kaynak eklenirken en az bir etiket verdiğinizde, otomatik etiketleyicinin güvenle söyleyecek bir şeyi olmadığında bile kaynağın gönderilerinin bültenlere ve /summary çıktısına yönlendirilebilmesini güvenceye alırsınız. Kaynak eklenirken belirlenen etiketler aynı zamanda kaynağın paylaşılan bootstrap etiketleri olur — o kaynağı takip eden herkese görünür — bu yüzden onları buna göre seçin. Yalnızca kendi gördüklerinizi ayarlamak için /follow-tag kullanın.
topic.personal-vs-shared-tags.answer=Etiketlerin iki katmanı vardır. Her kaynak, eklendiğinde belirlenen ve yalnızca bir bot yöneticisinin değiştirebileceği paylaşılan bootstrap etiketleri taşır — bunlar o kaynağı takip eden herkesi etkiler. Bunun üzerine, her kullanıcının yalnızca kendi görünümünü ayarlayan kişisel /follow-tag seçimleri vardır: varsayılan olarak kaynaklarınızdan gelen her şeyi görürsünüz ve bir konuyu /follow-tag ile takip ettiğiniz anda "yalnızca seçtiğim konular" görünümüne geçersiniz (yalnızca sizin için, bu kapsamda). /unfollow-tag tek bir konuyu çıkarır; /unfollow-tag --all sizi varsayılan olan kaynaklarımdan gelen her şey görünümüne döndürür.
topic.clear-vs-forget.answer=/clear ve /forget ikisi de konuşma verisini siler, ama farklı kapsamlarda. /clear yalnızca şu anki konuşmanın kısa vadeli bağlamını düşürür — daha uzun vadeli belleğiniz ve kaydettiğiniz gönderiler kalır. /forget ise tam gizlilik temizliğidir: bu kapsamda botun adınıza tuttuğu her şeyi siler (sohbet belleği, şu anki konuşma ve kaydedilmiş gönderi kitaplığınız — kayıtlar geneldir, bu yüzden hangi konuşmada /forget çalıştırırsanız çalıştırın silinirler). /clear geri alınabilir: bot siz sohbet ettikçe bağlamı yeniden kurar. /forget geri alınamaz ve önce onay ister.
topic.forget-erasure.answer=/forget, çalıştırdığınız kapsam için şunları siler: sohbet belleğiniz (bu konuşmaya ait chat_memory satırları), sohbet oturumlarınız ve mesajları (bu konuşmaya ait chat_session ve chat_message satırları) ve kişisel özet çapalarınız (bu konuşma için personal işaretli summary_anchor satırları). Ayrıca kaydedilmiş gönderi kitaplığınızı genel olarak siler — kullanıcınıza ait saved_post satırlarını her kapsamda, çünkü kayıtlar D13 kararına göre geneldir. /forget şunlara DOKUNMAZ: yasak ya da yönetici durumunuz, grup üyelikleriniz ve sistemin değiştirilemez denetim kaydı (bu kayıt işlemlerin gerçekleştiğini tutar, mesaj içeriğinizi asla). Başka konuşmalarda hâlâ veriniz varsa bunu size bildirir, böylece onları da temizleyebilirsiniz.
