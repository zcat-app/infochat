help.cmd.summary.usage=/summary [tag] [-w <duration>] [--short|--full|--flat]\n\nTakip ettiğiniz kaynaklardan gelen son gönderilerin özeti.\n\n  [tag]          isteğe bağlı — tek bir etikete daraltır\n  -w <duration>  zaman aralığı: 1h-168h, 1d-30d, 1w-4w (varsayılan 24h; dakika kabul edilmez)\n  --short        kategori başına tek satırlık özet (hızlı bakış; haber başına metin yok)\n  --full         her haber kategori başlıkları altında (kategori başına sınır yok)\n  --flat         haber başına tek ayrıntılı blok (düz kümelenmiş biçim)\n\nHiçbir seçenek verilmezse gönderiler kategori başlıkları altında, kategori başına bir sınırla gruplanır (okunaklı varsayılan). Üç biçim seçeneği birbirini dışlar.
help.cmd.summary.examples=\ \ /summary\n  /summary -w 7d\n  /summary ai -w 30d
help.cmd.list-sources.usage=/list-sources [--page <n>]\n\nBu kapsamın abone olduğu kaynakları listeler.\n\n  --page <n>  uzun listelerde sayfalama (sayfa başına 20)
