help.cmd.get-sources.usage=/get-sources [--page <n>]\n\nBu kapsamın abone olduğu kaynakları listeler (/list-sources komutunun yönetici olmayan eşdeğeri).\n\n  --page <n>  uzun listelerde sayfalama (sayfa başına 20)
