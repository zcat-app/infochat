help.cmd.add-source.usage=/add-source <url> --tags <tag>[,<tag>...] [--type <kind>] [--category <cat>] [--name <name>] [--lang <code>]\n\nBir kaynağı kaydeder, böylece gönderileri işleme hattına girer.\n\n  <url>             kaynağın URL adresi\n  --tags <csv>      zorunlu — denetimli sözlükten en az bir etiket\n  --type <kind>     isteğe bağlı — kaynak türü, örneğin rss\n  --category <cat>  isteğe bağlı — news, blog veya social (varsayılan news)\n  --name <name>     isteğe bağlı — görünen adı değiştirir\n  --lang <code>     isteğe bağlı — bildirilen kaynak dili, en veya cs (varsayılan en)
help.cmd.add-source.examples=\ \ /add-source https://example.org/feed.xml --tags security\n  /add-source https://example.org/blog/rss --tags ai,research --category blog
help.cmd.follow-all-sources.usage=/follow-all-sources\n\nBu kapsamın /unfollow-source ile çıkardığı her standart kaynağı yeniden dahil eder. Standart kaynaklar varsayılan olarak görünürdür; bu komut bu kapsamdaki çıkarmaları temizler.
