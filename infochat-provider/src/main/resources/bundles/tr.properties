help.cmd.save.usage=/save <uid> [-t <tag>[,<tag>...]]\n\nBir gönderiyi kitaplığınıza kaydeder (kayıtlarınız tüm kapsamlarınızda ortaktır).\n\n  <uid>                özetlerde ve bültenlerde gösterilen gönderi uid değeri\n  -t <tag>[,<tag>...]  isteğe bağlı — kişisel etiket ekler (serbest metin, en fazla 20)
help.cmd.save.examples=\ \ /save 3f9c2a\n  /save 3f9c2a -t research,privacy
help.cmd.saved.usage=/saved [tag] [-w <duration>] [--page <n>]\n\nKaydettiğiniz gönderileri listeler (kayıtlar kullanıcıya özeldir, tüm kapsamlarda geçerlidir).\n\n  [tag]          isteğe bağlı — yalnızca bu kişisel etiketi taşıyan kayıtlar\n  -w <duration>  isteğe bağlı — yalnızca son <N>h, <N>d veya <N>w içindeki kayıtlar\n  --page <n>     uzun listelerde sayfalama (sayfa başına 20)
