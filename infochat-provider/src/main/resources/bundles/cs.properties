help.cmd.revoke-admin.usage=/revoke-admin <contact>\n\nOdebere uživateli práva správce bota. Poslednímu zbývajícímu správci je nelze odebrat.\n\n  <contact>  kontaktní id uživatele na tomto adaptéru
