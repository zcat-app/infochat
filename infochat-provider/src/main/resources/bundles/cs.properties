help.cmd.get-sources.usage=/get-sources [--page <n>]\n\nVypíše zdroje, k nimž je tento rozsah přihlášen (alias /list-sources bez administrátorských přepínačů).\n\n  --page <n>  stránkování dlouhých seznamů (20 na stránku)
help.cmd.get-sources.examples=\ \ /get-sources\n  /get-sources --page 2
help.cmd.summary.usage=/summary [tag] [-w <duration>]\n\nSouhrn nedávných příspěvků ze zdrojů, které sledujete.\n\n  [tag]          volitelné — zúží výběr na jeden tag\n  -w <duration>  časové okno: 1h-168h, 1d-30d, 1w-4w (výchozí 24h; minuty nejsou podporovány)
