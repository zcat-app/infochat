help.cmd.ban.usage=/ban <contact> [--reason "..."]\n\nZabanuje uživatele: jeho zprávy jsou zahazovány už na vstupu. Vyžaduje potvrzení.\n\n  <contact>       kontaktní id uživatele\n  --reason "..."  volitelné — poznámka uložená k banu
