help.cmd.save.usage=/save <uid> [-t <tag>[,<tag>...]]\n\nUloží příspěvek do vaší knihovny (uložení platí napříč všemi vašimi rozsahy).\n\n  <uid>                uid příspěvku zobrazené v souhrnech\n  -t <tag>[,<tag>...]  volitelné — připojí osobní tagy (volný text, nejvýše 20)
help.cmd.save.examples=\ \ /save 3f9c2a\n  /save 3f9c2a -t research,privacy
help.cmd.saved.usage=/saved [tag] [-w <duration>] [--page <n>]\n\nVypíše vaše uložené příspěvky (uložení platí pro uživatele napříč všemi rozsahy).\n\n  [tag]          volitelné — jen uložení s tímto osobním tagem\n  -w <duration>  volitelné — jen uložení z posledních <N>h, <N>d nebo <N>w\n  --page <n>     stránkování dlouhých seznamů (20 na stránku)
help.cmd.saved.examples=\ \ /saved\n  /saved research -w 30d
help.cmd.unsave.usage=/unsave <uid>\n\nOdebere příspěvek z vaší knihovny.\n\n  <uid>  uid příspěvku zobrazené příkazem /saved
