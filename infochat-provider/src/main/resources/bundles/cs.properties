help.cmd.retry.usage=/retry [--digest]\n\nZnovu vygeneruje text vašeho posledního shrnutí.\n\n  --digest  místo toho znovu vygeneruje poslední pravidelný přehled této skupiny. Pouze ve skupině a pouze pro správce skupiny nebo správce bota.
