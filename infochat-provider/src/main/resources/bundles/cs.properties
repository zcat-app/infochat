# Deterministic Czech bundle for Provider's user-visible strings.
# Per decision D43 + docs/design/03-commands.md §3.4. Every key listed
# here mirrors a constant in BundleKeys.java; BundleLoaderTest iterates
# BundleKeys via reflection and asserts each constant resolves to a
# non-empty string in EVERY loaded bundle (M1-060 bilateral widening).
# Adding a third language is a bundle drop-in: ship <lang>.properties
# alongside this file and add the code to BundleLoader.LOADED_LANGUAGES.
#
# UTF-8 encoded; BundleLoader wraps the InputStream in an
# InputStreamReader(UTF-8) so diacritics (á, ě, š, č, ř, ž, ý, í, ú, ů)
# ship as-is. MessageFormat placeholder tokens ({0}, {1}, ...) are
# identical to en.properties in position and count so the existing
# MessageFormat.format(template, args...) call sites resolve correctly
# regardless of language.

help.header.dm-user=Dostupné příkazy:
help.cmd.help.short=/help — vypíše dostupné příkazy
help.cmd.add-source.short=/add-source <url> --tags <tag>[,<tag>...] — zaregistruje zdroj
help.cmd.summary.short=/summary [--since <duration>] [--tag <tag>] — shrne nedávné příspěvky

error.unknown_command=Neznámý příkaz. Použijte /help pro seznam dostupných příkazů.
error.internal=Při zpracování zprávy nastala chyba. Zkuste to prosím znovu.

chat_mode.not_in_mvp=Chatovací režim v MVP zatím není k dispozici; použijte /help pro seznam dostupných příkazů.

