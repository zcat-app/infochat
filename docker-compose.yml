# Local development database for the laptop profile.
#
# Image is the maintained pgvector upstream — Postgres 16 with the pgvector
# binary already bundled. Vanilla postgres:16 does not ship the binary, so
# CREATE EXTENSION vector (lands with M1-005's first Flyway migration)
# would fail without a custom Dockerfile.
#
# The default POSTGRES_PASSWORD is for local dev only; production deployments
# MUST override via the environment.
#
# Role/database creation is owned by docker/postgres-init.sh (run once at first
# container init), not by POSTGRES_USER/POSTGRES_DB — the init script creates the
# infochat owner + database and the two service roles WITH their env-driven
# passwords (07-deployment.md §Database role bootstrap).

# ── Production resource caps (M1-512) ──────────────────────────────────────
# Every long-running prod service below declares deploy.resources: a memory
# limit + reservation and a CPU limit. Compose v2 honours deploy.resources for
# `docker compose up` — no swarm needed. These are BLAST-RADIUS caps, not
# tuning: each ceiling sits ABOVE steady state with headroom so normal
# operation never reaches it; a genuine runaway hits its own container's limit
# and is OOM-killed-and-restarted (the llama services carry
# restart: unless-stopped) instead of thrashing the whole host. Root cause of
# the 2026-06-28 resource-exhaustion incident was an un-capped overshoot on a
# zero-swap host (07-deployment.md §7.8.7).
#
# Sized for the reference prod host (4 vCPU / 15 GB, vps profile §7.8.3).
# Memory RESERVATIONS sum well under host RAM so the scheduler can place every
# container; memory LIMITS may sum above it because they are per-container
# ceilings not all hit at once, and host swap absorbs a transient overlap
# (07-deployment.md §7.8.7 "Host swap"). CPU limits only THROTTLE (never kill):
# capping the generative llama.cpp server below the 4-core count keeps a core
# free for Postgres + the JVMs, countering the incident's all-cores-pegged
# inference. The two JVM services additionally pin a heap ceiling BELOW their
# memory limit (see their JAVA_TOOL_OPTIONS) so the JVM hits a managed heap
# limit before the cgroup OOM-killer fires. The numbers are starting points
# above the model/JVM footprints, not measured optima — adjust per the actual
# generative model. The `ollama` service is intentionally uncapped: it is not
# one of the five always-on prod services and runs only in the dev inner loop
# or the optional Ollama-embeddings shape (§7.8.7 tells the operator to tear
# down an unused Ollama runtime).

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      # Bootstrap superuser for the image's own initdb. Nothing connects as this
      # role after init (apps use infochat_collector/infochat_provider; Flyway
      # uses the infochat owner) — but the image requires it to be set.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infochat-dev}
      # Service-role passwords consumed by docker/postgres-init.sh. Empty
      # pass-throughs: an operator's exported value (or a local .env / the
      # wizard's secrets.env) wins; an unset var resolves to empty and trips the
      # init script's ${VAR:?} fail-loud guard rather than baking a known secret.
      INFOCHAT_DB_PASSWORD: ${INFOCHAT_DB_PASSWORD:-}
      INFOCHAT_COLLECTOR_PASSWORD: ${INFOCHAT_COLLECTOR_PASSWORD:-}
      INFOCHAT_PROVIDER_PASSWORD: ${INFOCHAT_PROVIDER_PASSWORD:-}
    ports:
      # Bind to loopback only: a bare "5432:5432" publishes the dev DB on
      # every host interface (0.0.0.0), reachable from the LAN with the
      # default dev password above. Loopback keeps it to the dev machine.
      - "127.0.0.1:5432:5432"
    volumes:
      - infochat-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/postgres-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infochat -d infochat"]
      interval: 5s
      timeout: 3s
      retries: 12
    # Resource caps (M1-512; rationale above): Postgres steady-state RSS at this
    # scale (~50 users) is a few hundred MB plus shared_buffers; 2g leaves ample
    # headroom while still bounding a runaway query/connection storm.
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2g
        reservations:
          memory: 512m

  # --- prod-profile app services (M1-379) ------------------------------------
  # Collector and Provider run as built container images under the `prod`
  # profile only; the `dev` profile keeps running the apps on the host via
  # quarkus:dev (07-deployment.md §7.7). The build context is the repo root so
  # the in-image multi-module Maven build sees the full reactor (.dockerignore
  # trims the context).
  #
  # Runtime config beyond the DB wiring below — infochat.profile, the LLM
  # endpoints (M1-380), and the messaging adapters / bootstrap admin — is
  # supplied by the §7.7.2 wizard (M1-382+) at deploy time and is out of scope
  # here. These definitions cover the image build, the per-service DB
  # credentials, and the only-Collector-migrates startup ordering.
  infochat-collector:
    profiles: [prod]
    build:
      context: .
      dockerfile: infochat-collector/src/main/docker/Dockerfile.jvm
    environment:
      # Inside a container `localhost` is the container itself, so both
      # datasources must point at the postgres compose service, not localhost
      # (the app properties only define the JDBC URL per host profile; this env
      # override at config ordinal 300 wins regardless of profile).
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/infochat
      QUARKUS_DATASOURCE_OWNER_JDBC_URL: jdbc:postgresql://postgres:5432/infochat
      # Per-service DB-role credentials (M1-378): the weak collector role for
      # the default datasource, the owner role for Flyway. Empty pass-throughs —
      # the app properties read these with no fallback, so an unset value fails
      # startup fast rather than running with a guessable secret.
      INFOCHAT_COLLECTOR_PASSWORD: ${INFOCHAT_COLLECTOR_PASSWORD:-}
      INFOCHAT_DB_PASSWORD: ${INFOCHAT_DB_PASSWORD:-}
      # Remote LLM API key (remote-llm profile): the mounted application.properties
      # references it as ${INFOCHAT_LLM_API_KEY} for the eval-pipeline LLM + the
      # embeddings provider. Empty pass-through — blank for a local Ollama/llama.cpp
      # setup where no key is written (§7.7.2 "Runtime config delivery", §7.3).
      INFOCHAT_LLM_API_KEY: ${INFOCHAT_LLM_API_KEY:-}
      # Heap ceiling BELOW the container memory limit (M1-512): the deploy limit
      # below is 1536m; MaxRAMPercentage=60 caps the heap near ~920m so the JVM
      # hits a managed OutOfMemoryError (GC pressure first) before the cgroup
      # OOM-killer SIGKILLs the container. Set via JAVA_TOOL_OPTIONS, NOT
      # JAVA_OPTS: the image ENTRYPOINT is a bare `java -jar quarkus-run.jar`
      # (Dockerfile.jvm) that does not expand $JAVA_OPTS, whereas the JVM
      # auto-reads JAVA_TOOL_OPTIONS regardless of launch form.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0"
    volumes:
      # Wizard-generated runtime config (§7.7.2 "Runtime config delivery"): mounted
      # read-only at config/application.properties relative to the fast-jar working
      # dir (/app), so Quarkus reads it at the external-config ordinal (260) — above
      # the image-baked application.properties (250) and below the explicit
      # environment: overrides above (env vars, 300). Carries quarkus.profile,
      # infochat.llm.* / infochat.embeddings.*; secrets are referenced as ${VAR} and
      # arrive via environment: (above), never written into this file (§7.3).
      - ./prod/runtime/application.properties:/app/config/application.properties:ro
      # Wizard-seeded bootstrap files (§7.7.2 step 5): mounted at the fast-jar
      # workdir (/app) so the Collector resolves them via the basenames in
      # application.properties (infochat.bootstrap.{sources,assets}-file). The
      # config carries the basename, NOT a host path, precisely because the host
      # path does not exist inside the container. Read-only — the loaders only read.
      - ./prod/runtime/bootstrap-sources.json:/app/bootstrap-sources.json:ro
      - ./prod/runtime/bootstrap-assets.json:/app/bootstrap-assets.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # In-container loopback probe: quarkus.http.host=127.0.0.1 binds the
      # readiness endpoint to the container's loopback, so the probe must run
      # inside the container (Docker healthchecks do) and curl is installed in
      # the runtime image for exactly this.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/q/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    # Resource caps (M1-512; rationale above): a lean Quarkus JVM. The 1536m
    # limit sits above heap (~920m, JAVA_TOOL_OPTIONS) + non-heap (metaspace,
    # thread stacks, Netty direct buffers, code cache); the JVM hits its own
    # heap ceiling before this cgroup limit.
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536m
        reservations:
          memory: 512m

  infochat-provider:
    profiles: [prod]
    build:
      context: .
      dockerfile: infochat-provider/src/main/docker/Dockerfile.jvm
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/infochat
      # The Provider never holds owner credentials and does not migrate; only
      # the weak provider role for its default datasource.
      INFOCHAT_PROVIDER_PASSWORD: ${INFOCHAT_PROVIDER_PASSWORD:-}
      # The mounted application.properties references these secrets as ${VAR}; they
      # must reach the container env for Quarkus to expand them at boot, or the
      # Provider fails as the adapter / bootstrap-admin config resolves (§7.7.2
      # "Runtime config delivery"). Empty pass-throughs — the per-adapter lines and
      # the api-key line are written only when the wizard configures that adapter /
      # the remote LLM, so an unset var pairs with an absent property reference and
      # is inert. Secrets stay in the environment, never in a mounted file (§7.3).
      INFOCHAT_LLM_API_KEY: ${INFOCHAT_LLM_API_KEY:-}
      INFOCHAT_SIMPLEX_ADMIN_CONTACT_ID: ${INFOCHAT_SIMPLEX_ADMIN_CONTACT_ID:-}
      # SimpleX bootstrap admin is the single-use claim-token (D50/M1-506); the
      # mounted application.properties references it as
      # infochat.adapters.simplex.admin-token=${INFOCHAT_SIMPLEX_ADMIN_TOKEN}, so
      # the var MUST reach the container env or gate 7 fails "admin union empty".
      INFOCHAT_SIMPLEX_ADMIN_TOKEN: ${INFOCHAT_SIMPLEX_ADMIN_TOKEN:-}
      INFOCHAT_SIGNAL_ADMIN_CONTACT_ID: ${INFOCHAT_SIGNAL_ADMIN_CONTACT_ID:-}
      # Heap ceiling BELOW the container memory limit (M1-512), same rationale as
      # the Collector above: the deploy limit is 1536m; MaxRAMPercentage=60 caps
      # the heap near ~920m so the JVM hits a managed OutOfMemoryError before the
      # cgroup OOM-killer fires. JAVA_TOOL_OPTIONS (not JAVA_OPTS) because the
      # bare `java -jar` ENTRYPOINT does not expand $JAVA_OPTS.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0"
    volumes:
      # Runtime config — same mount as the Collector (§7.7.2): carries the operator's
      # quarkus.profile, infochat.llm.*, infochat.adapters, and the per-adapter
      # blocks. The Provider's image declares NO production infochat.adapters (only
      # %test), so this mount is what carries that key and lets the Provider boot
      # past AdapterRegistry gate 1 (§7.12.1). Read-only — the app never writes it.
      - ./prod/runtime/application.properties:/app/config/application.properties:ro
      # Asset bootstrap (§7.7.2 step 5): the Provider's AssetRegistry reads
      # bootstrap-assets.json via its basename relative to the fast-jar workdir
      # (/app), the same file the Collector's BootstrapAssetsLoader reads. Sources
      # are Collector-only, so the Provider mounts assets alone. Read-only.
      - ./prod/runtime/bootstrap-assets.json:/app/bootstrap-assets.json:ro
      # Adapter identity material captured out-of-band in step 6 (§7.5, §7.7.2):
      # bind-mounted at the adapter's configured data-dir so the running adapters
      # read the queue keypair / signal-cli account dir they validate at startup.
      # Read-write — signal-cli mutates its account directory at runtime (§7.8.1
      # ReadWritePaths). 6-adapter.sh emits the operator's data-dir as
      # INFOCHAT_<NAME>_DATA_DIR into secrets.env (fed to compose via --env-file in
      # 7-apps.sh), so a non-default dir is mounted source+target = the path written
      # to infochat.adapters.<name>.data-dir and the adapter's validate() finds it
      # (M1-391). Absent the var — e.g. a bare `docker compose config` — the
      # documented default below applies.
      - ${INFOCHAT_SIMPLEX_DATA_DIR:-/var/lib/infochat/simplex}:${INFOCHAT_SIMPLEX_DATA_DIR:-/var/lib/infochat/simplex}
      - ${INFOCHAT_SIGNAL_DATA_DIR:-/var/lib/infochat/signal-cli}:${INFOCHAT_SIGNAL_DATA_DIR:-/var/lib/infochat/signal-cli}
    depends_on:
      # Only the Collector runs Flyway in production (spec/deployment.md
      # §Topology), so the Provider must not start until the Collector is
      # healthy and the migration set has been applied.
      infochat-collector:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # Resource caps (M1-512; rationale above): same envelope as the Collector —
    # a lean Quarkus JVM whose heap ceiling sits below this cgroup limit.
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536m
        reservations:
          memory: 512m

  # --- LLM backend services (M1-380, M1-417) ---------------------------------
  # The operator picks a local LLM backend shape; the §7.7.2 wizard starts the
  # matching services alongside `--profile prod` via Compose profiles. Per D49,
  # llama.cpp is a real standalone backend served by ONE instance per model
  # (unlike Ollama, which serves many models dynamically by name), so the shapes
  # are:
  #   - Ollama (generative + embeddings):  --profile prod --profile ollama
  #   - llama.cpp + llama.cpp embeddings:  --profile prod --profile llamacpp --profile llamacpp-embeddings
  #   - llama.cpp + Ollama embeddings:     --profile prod --profile llamacpp --profile ollama
  # The last shape runs two LLM services together (generative llama.cpp + the
  # 768-dim nomic embedder on Ollama): D49 relaxes the earlier "operator picks
  # ONE local backend" rule for exactly this case, because one llama-server
  # cannot be both the generative model and a second fixed-dimension embedder.
  # A bare `--profile prod` starts none of them (a service starts iff ANY enabled
  # profile matches). Ollama additionally carries `dev` because the developer
  # inner loop (quarkus:dev on the host) uses it (07-deployment.md §7.7). The
  # remote-LLM path needs no service here — the app calls the remote API directly
  # and the wizard collects only the base-url/key.
  #
  # Model provisioning (ollama pull / GGUF download) is the wizard's job
  # (M1-383): these stanzas declare the containers and their model-cache volumes
  # only. Images are pinned to explicit tags (M1-004 precedent).
  ollama:
    profiles: [dev, ollama]
    image: ollama/ollama:0.30.8
    ports:
      # Loopback only (postgres precedent above): in the `dev` shape the host's
      # quarkus:dev services reach Ollama at localhost:11434; a bare
      # "11434:11434" would publish the model server on every interface. Under
      # `prod` the containerized apps reach it over the compose network instead.
      - "127.0.0.1:11434:11434"
    volumes:
      - infochat-ollama:/root/.ollama

  llamacpp:
    profiles: [llamacpp]
    # llama.cpp's HTTP server speaks the OpenAI-compatible API the LLM adapter
    # already supports (infochat.llm.*.provider=openai-compatible, §7.4). prod
    # only — the containerized apps reach it over the compose network as
    # llamacpp:8080, so it needs no host port publish.
    image: ghcr.io/ggml-org/llama.cpp:server-b9776
    # Recover automatically from a kernel OOM kill (exit 137). Without a restart
    # policy an OOM-killed model server stays dead, and once its container exits
    # the compose-network DNS name `llamacpp` stops resolving — so the
    # collector's tagger/entity LLM calls fail with UnresolvedAddressException
    # and ingestion stalls silently (RAW backlog, no surfaced error). The model
    # fits the host in steady state; the kill was a transient memory peak, so a
    # restart recovers. `unless-stopped` (not `always`) restarts on failure and
    # host reboot while still honoring an operator `docker compose stop`.
    restart: unless-stopped
    environment:
      # The operator-chosen generative GGUF *filename* is minted by the §7.3
      # wizard (4-llm.sh) into secrets.env and fed to compose via --env-file;
      # compose builds the in-container model path from it. HOST/PORT are fixed
      # serve wiring (reachable as llamacpp:8080 over the compose network), not
      # operator data, so they stay here rather than in secrets.env. ${VAR:-}
      # keeps `docker compose config` renderable when unset (postgres/provider
      # pass-through precedent). llama-server reads these LLAMA_ARG_* env knobs as
      # -m / --host / --port; without them the image gets no model and exits, and
      # would bind container-loopback instead of being reachable as llamacpp:8080
      # (D49, M1-417).
      LLAMA_ARG_MODEL: /models/${INFOCHAT_LLAMACPP_GGUF:-}
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8080"
      # Reasoning stays OFF: llama.cpp's default --reasoning auto detects the
      # Gemma 4 template's thinking channel and turns it ON, so per-task
      # max-tokens caps (M1-548, sized for visible output) are consumed by
      # <|channel>thought tokens — empty or format-broken replies (F-live-8,
      # host-proven 2026-07-04). Applies to any thinking-capable GGUF, the
      # pinned default included.
      LLAMA_ARG_REASONING: "off"
    volumes:
      - infochat-llamacpp-models:/models
    healthcheck:
      # llama-server exposes GET /health (200 once the model is loaded and ready);
      # curl ships in the image. Loopback probe — the server binds 0.0.0.0 so
      # 127.0.0.1 inside the container resolves to it (collector precedent above).
      # Generous start_period: loading a multi-GB GGUF into memory is slow.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    # Resource caps (M1-512; rationale above): the generative server is the
    # dominant consumer — resident GGUF weights (vps-profile 3B-8B Q4 ≈ 2-5 GB)
    # plus KV cache. 7g limit sits above that with headroom; 3g reservation
    # guarantees placement. cpus 3.0 (of 4) is the key incident mitigation: it
    # caps inference below the core count so a request burst cannot peg all
    # cores and starve Postgres + the JVMs (the 2026-06-28 failure mode).
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 7g
        reservations:
          memory: 3g

  # Second llama.cpp instance for the pure-llama.cpp embeddings shape (M1-417,
  # D49): one llama-server serves exactly one model, so the fixed 768-dim nomic
  # embedder cannot share the generative server. LLAMA_ARG_EMBEDDINGS (--embeddings)
  # puts this instance in embedding mode; infochat.embeddings.* points at
  # llamacpp-embeddings:8080. Only started in the pure-llama.cpp shape (its own
  # profile); the Ollama-embeddings shape runs the `ollama` service instead.
  # Shares the model-cache volume — 4-llm.sh downloads both GGUFs into it.
  llamacpp-embeddings:
    profiles: [llamacpp-embeddings]
    image: ghcr.io/ggml-org/llama.cpp:server-b9776
    # Same OOM-recovery rationale as the `llamacpp` service above: a dead
    # embeddings server drops the `llamacpp-embeddings` DNS name and stalls the
    # embedding stage. `unless-stopped` brings it back after an OOM or reboot.
    restart: unless-stopped
    environment:
      LLAMA_ARG_MODEL: /models/${INFOCHAT_LLAMACPP_EMBED_GGUF:-}
      LLAMA_ARG_EMBEDDINGS: "1"
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8080"
    volumes:
      - infochat-llamacpp-models:/models
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    # Resource caps (M1-512; rationale above): the 768-dim nomic-class embedder
    # is small (weights well under 1 GB) but CPU-bursty under an embedding
    # backlog (1877 inference requests drove the 2026-06-28 window). 2g limit is
    # generous headroom; cpus 1.5 caps the burst so it cannot pile onto the
    # generative server's cores.
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2g
        reservations:
          memory: 512m

volumes:
  infochat-pgdata:
  infochat-ollama:
  # Pin the real Docker volume name so it is independent of the compose project
  # (which defaults to the working-dir basename). Without `name:`, compose
  # namespaces this to <project>_infochat-llamacpp-models, which the wizard's
  # `fetch_gguf` literal `-v infochat-llamacpp-models:/models` (4-llm.sh) never
  # matches — the GGUFs download into a volume the servers never mount, and both
  # llama.cpp services exit(1) on a missing model (M1-442).
  infochat-llamacpp-models:
    name: infochat-llamacpp-models
