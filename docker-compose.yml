# Local development database for the laptop profile.
#
# Image is the maintained pgvector upstream — Postgres 16 with the pgvector
# binary already bundled. Vanilla postgres:16 does not ship the binary, so
# CREATE EXTENSION vector (lands with M1-005's first Flyway migration)
# would fail without a custom Dockerfile.
#
# The default POSTGRES_PASSWORD is for local dev only; production deployments
# MUST override via the environment.
#
# Role/database creation is owned by docker/postgres-init.sh (run once at first
# container init), not by POSTGRES_USER/POSTGRES_DB — the init script creates the
# infochat owner + database and the two service roles WITH their env-driven
# passwords (07-deployment.md §Database role bootstrap).

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      # Bootstrap superuser for the image's own initdb. Nothing connects as this
      # role after init (apps use infochat_collector/infochat_provider; Flyway
      # uses the infochat owner) — but the image requires it to be set.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infochat-dev}
      # Service-role passwords consumed by docker/postgres-init.sh. Empty
      # pass-throughs: an operator's exported value (or a local .env / the
      # wizard's secrets.env) wins; an unset var resolves to empty and trips the
      # init script's ${VAR:?} fail-loud guard rather than baking a known secret.
      INFOCHAT_DB_PASSWORD: ${INFOCHAT_DB_PASSWORD:-}
      INFOCHAT_COLLECTOR_PASSWORD: ${INFOCHAT_COLLECTOR_PASSWORD:-}
      INFOCHAT_PROVIDER_PASSWORD: ${INFOCHAT_PROVIDER_PASSWORD:-}
    ports:
      # Bind to loopback only: a bare "5432:5432" publishes the dev DB on
      # every host interface (0.0.0.0), reachable from the LAN with the
      # default dev password above. Loopback keeps it to the dev machine.
      - "127.0.0.1:5432:5432"
    volumes:
      - infochat-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/postgres-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infochat -d infochat"]
      interval: 5s
      timeout: 3s
      retries: 12

  # --- prod-profile app services (M1-379) ------------------------------------
  # Collector and Provider run as built container images under the `prod`
  # profile only; the `dev` profile keeps running the apps on the host via
  # quarkus:dev (07-deployment.md §7.7). The build context is the repo root so
  # the in-image multi-module Maven build sees the full reactor (.dockerignore
  # trims the context).
  #
  # Runtime config beyond the DB wiring below — infochat.profile, the LLM
  # endpoints (M1-380), and the messaging adapters / bootstrap admin — is
  # supplied by the §7.7.2 wizard (M1-382+) at deploy time and is out of scope
  # here. These definitions cover the image build, the per-service DB
  # credentials, and the only-Collector-migrates startup ordering.
  infochat-collector:
    profiles: [prod]
    build:
      context: .
      dockerfile: infochat-collector/src/main/docker/Dockerfile.jvm
    environment:
      # Inside a container `localhost` is the container itself, so both
      # datasources must point at the postgres compose service, not localhost
      # (the app properties only define the JDBC URL per host profile; this env
      # override at config ordinal 300 wins regardless of profile).
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/infochat
      QUARKUS_DATASOURCE_OWNER_JDBC_URL: jdbc:postgresql://postgres:5432/infochat
      # Per-service DB-role credentials (M1-378): the weak collector role for
      # the default datasource, the owner role for Flyway. Empty pass-throughs —
      # the app properties read these with no fallback, so an unset value fails
      # startup fast rather than running with a guessable secret.
      INFOCHAT_COLLECTOR_PASSWORD: ${INFOCHAT_COLLECTOR_PASSWORD:-}
      INFOCHAT_DB_PASSWORD: ${INFOCHAT_DB_PASSWORD:-}
      # Remote LLM API key (remote-llm profile): the mounted application.properties
      # references it as ${INFOCHAT_LLM_API_KEY} for the eval-pipeline LLM + the
      # embeddings provider. Empty pass-through — blank for a local Ollama/llama.cpp
      # setup where no key is written (§7.7.2 "Runtime config delivery", §7.3).
      INFOCHAT_LLM_API_KEY: ${INFOCHAT_LLM_API_KEY:-}
    volumes:
      # Wizard-generated runtime config (§7.7.2 "Runtime config delivery"): mounted
      # read-only at config/application.properties relative to the fast-jar working
      # dir (/app), so Quarkus reads it at the external-config ordinal (260) — above
      # the image-baked application.properties (250) and below the explicit
      # environment: overrides above (env vars, 300). Carries quarkus.profile,
      # infochat.llm.* / infochat.embeddings.*; secrets are referenced as ${VAR} and
      # arrive via environment: (above), never written into this file (§7.3).
      - ./prod/runtime/application.properties:/app/config/application.properties:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # In-container loopback probe: quarkus.http.host=127.0.0.1 binds the
      # readiness endpoint to the container's loopback, so the probe must run
      # inside the container (Docker healthchecks do) and curl is installed in
      # the runtime image for exactly this.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/q/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  infochat-provider:
    profiles: [prod]
    build:
      context: .
      dockerfile: infochat-provider/src/main/docker/Dockerfile.jvm
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/infochat
      # The Provider never holds owner credentials and does not migrate; only
      # the weak provider role for its default datasource.
      INFOCHAT_PROVIDER_PASSWORD: ${INFOCHAT_PROVIDER_PASSWORD:-}
      # The mounted application.properties references these secrets as ${VAR}; they
      # must reach the container env for Quarkus to expand them at boot, or the
      # Provider fails as the adapter / bootstrap-admin config resolves (§7.7.2
      # "Runtime config delivery"). Empty pass-throughs — the per-adapter lines and
      # the api-key line are written only when the wizard configures that adapter /
      # the remote LLM, so an unset var pairs with an absent property reference and
      # is inert. Secrets stay in the environment, never in a mounted file (§7.3).
      INFOCHAT_LLM_API_KEY: ${INFOCHAT_LLM_API_KEY:-}
      INFOCHAT_SIMPLEX_ADMIN_CONTACT_ID: ${INFOCHAT_SIMPLEX_ADMIN_CONTACT_ID:-}
      INFOCHAT_SIGNAL_ADMIN_CONTACT_ID: ${INFOCHAT_SIGNAL_ADMIN_CONTACT_ID:-}
      SIMPLEX_SESSION_TOKEN: ${SIMPLEX_SESSION_TOKEN:-}
    volumes:
      # Runtime config — same mount as the Collector (§7.7.2): carries the operator's
      # quarkus.profile, infochat.llm.*, infochat.adapters, and the per-adapter
      # blocks. The Provider's image declares NO production infochat.adapters (only
      # %test), so this mount is what carries that key and lets the Provider boot
      # past AdapterRegistry gate 1 (§7.12.1). Read-only — the app never writes it.
      - ./prod/runtime/application.properties:/app/config/application.properties:ro
      # Adapter identity material captured out-of-band in step 6 (§7.5, §7.7.2):
      # bind-mounted at the documented default identity-dir paths so the running
      # adapters read the queue keypair / signal-cli account dir they validate at
      # startup. Read-write — signal-cli mutates its account directory at runtime
      # (§7.8.1 ReadWritePaths). Static default locations (operator-overridden paths
      # would need a wizard-emitted compose variable, out of this ticket's scope).
      - /var/lib/infochat/simplex:/var/lib/infochat/simplex
      - /var/lib/infochat/signal-cli:/var/lib/infochat/signal-cli
    depends_on:
      # Only the Collector runs Flyway in production (spec/deployment.md
      # §Topology), so the Provider must not start until the Collector is
      # healthy and the migration set has been applied.
      infochat-collector:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # --- LLM backend services (M1-380) -----------------------------------------
  # The operator picks ONE local LLM backend; the §7.7.2 wizard starts the
  # chosen one alongside `--profile prod` via its Compose profile —
  # `--profile prod --profile ollama` OR `--profile prod --profile llamacpp`.
  # Each backend is profile-gated, so a bare `--profile prod` starts NEITHER and
  # the two never run together (a service starts iff ANY enabled profile
  # matches). Ollama additionally carries `dev` because the developer inner loop
  # (quarkus:dev on the host) uses it (07-deployment.md §7.7). The remote-LLM
  # path needs no service here — the app calls the remote API directly and the
  # wizard collects only the base-url/key.
  #
  # Model provisioning (ollama pull / GGUF download) is the wizard's job
  # (M1-383): these stanzas declare the containers and their model-cache volumes
  # only. Images are pinned to explicit tags (M1-004 precedent).
  ollama:
    profiles: [dev, ollama]
    image: ollama/ollama:0.30.8
    ports:
      # Loopback only (postgres precedent above): in the `dev` shape the host's
      # quarkus:dev services reach Ollama at localhost:11434; a bare
      # "11434:11434" would publish the model server on every interface. Under
      # `prod` the containerized apps reach it over the compose network instead.
      - "127.0.0.1:11434:11434"
    volumes:
      - infochat-ollama:/root/.ollama

  llamacpp:
    profiles: [llamacpp]
    # llama.cpp's HTTP server speaks the OpenAI-compatible API the LLM adapter
    # already supports (infochat.llm.*.provider=openai-compatible, §7.4). prod
    # only — the containerized apps reach it over the compose network as
    # llamacpp:8080, so it needs no host port publish.
    image: ghcr.io/ggml-org/llama.cpp:server-b5350
    volumes:
      - infochat-llamacpp-models:/models

volumes:
  infochat-pgdata:
  infochat-ollama:
  infochat-llamacpp-models:
