# infochat-collector — datasource, Flyway, and profile namespaces.
#
# Collector owns Flyway in v1 (see M1-005 Big-picture notes for the
# rationale; migrations move to infochat-core after M1-007a). Provider
# connects to the same Postgres but does not migrate.

# V2__roles.sql creates infochat_collector / infochat_provider /
# infochat_admin as NOLOGIN principals. The JDBC username below stays
# the bootstrap `infochat` superuser until the named-datasource wiring
# ticket lands; that ticket switches this module to connect as
# infochat_collector.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=infochat
quarkus.datasource.password=${POSTGRES_PASSWORD:infochat-dev}

# DevServices uses the same pgvector image as docker-compose so the
# `CREATE EXTENSION vector` in V1__init.sql works against the ephemeral
# test container the same way it does against the operator's DB. The
# JDBC URL is intentionally NOT declared at this base level — Quarkus
# DevServices treats "no URL configured" as its trigger to spin up a
# container, which is what the test profile relies on. Operator-facing
# profiles (laptop / vps / pi / remote-llm) declare the URL per-profile
# below so production runs connect to the configured Postgres instead.
quarkus.datasource.devservices.image-name=pgvector/pgvector:pg16

# migrate-at-start ensures the DB schema is up to date before the
# Collector accepts work. Safe in v1 because the deployment shape is
# exactly one Collector and one Provider; concurrent migration attempts
# are not a v1 concern.
quarkus.flyway.migrate-at-start=true

# infochat-llm-adapter ships @ApplicationScoped beans
# (OpenAiCompatibleProvider, LlmRouter, LlmRouterStartupGuard) that
# Quarkus's ArC must scan for CDI bean discovery. The module has no
# beans.xml and no jandex index in its JAR, so the consumer (this
# Collector) tells ArC to index it explicitly. M1-033's first LLM
# call site.
quarkus.index-dependency.llm-adapter.group-id=app.zcat.infochat
quarkus.index-dependency.llm-adapter.artifact-id=infochat-llm-adapter

# infochat-core ships @ApplicationScoped beans (AuditLogWriter,
# DefaultRedactionHook from M1-041) that Quarkus's ArC must scan for
# CDI bean discovery. Same shape as the infochat-llm-adapter entry
# above — the module has no beans.xml and no jandex index in its
# JAR, so this consumer tells ArC to index it explicitly.
quarkus.index-dependency.audit-core.group-id=app.zcat.infochat
quarkus.index-dependency.audit-core.artifact-id=infochat-core

# Stdout log redaction: every console log line passes through the
# closed API-key catalogue (Redactor) via RedactingLogFilter.
quarkus.log.console.filter=api-key-redactor

# Heartbeat tick base default. Quarkus' `test` profile (which @QuarkusTest
# runs under) does not inherit from any `%<infochat-profile>` namespace, so
# `%laptop.infochat.heartbeat.interval` is invisible to tests. Declaring
# the same value at base provides the test-time fallback while the
# `%laptop.*` declaration below remains the production-facing value
# (D41 / docs/design/07-deployment.md §7.8.5).
#
# %vps, %pi, and %remote-llm profiles intentionally do NOT yet declare this
# key — they fall back to the base value at deploy time. A future profile-
# tuning ticket adds explicit overrides per the design-suggested values in
# docs/design/07-deployment.md §7.2.1 (laptop stays at 5s; vps, pi, and
# remote-llm get their own values). Until that ticket lands, those three
# profiles silently inherit 5s from base, which is too aggressive for
# Pi-class hardware in particular — operator-side mitigation is to override
# `infochat.heartbeat.interval` via environment or system property.
infochat.heartbeat.interval=5s

# FetchScheduler heartbeat — how often the scheduler wakes to check
# whether any source kind is due for a tick. Each kind's own interval
# (infochat.fetch.<kind>.interval) gates actual dispatch. 1m keeps
# latency under one minute for the shortest per-kind interval.
infochat.fetch.heartbeat-interval=1m

# Per-kind fetch interval — each source kind ticks at its own cadence.
# Default (when no kind-specific key exists) is 5m. Quarkus
# duration-string syntax. Operator override:
# -Dinfochat.fetch.<kind>.interval=<duration>.
infochat.fetch.rss.interval=5m
infochat.fetch.bluesky.interval=10m
infochat.fetch.nitter.interval=10m
infochat.fetch.reddit.interval=15m
infochat.fetch.odysee.interval=30m
infochat.fetch.youtube.interval=30m

# Reddit per-tick pagination cap — number of listing pages fetched
# per tick before stopping. Design §1.6: 5 on laptop/vps/remote-llm,
# 2 on pi. The base default serves the test-time fallback the same
# way infochat.fetch.rss.interval does.
infochat.fetch.reddit.page-cap=5

# Per-host asset-snapshot tick cadence (D33, D42 — design §10.4). One
# @Scheduled tick per data-source host (coingecko / kraken / bitfinex),
# NOT per-(asset, sub_verb) — spec §Asset commands commits to "all
# kraken snapshots across every enabled asset share one tick cadence;
# same for coingecko and bitfinex". Per-pair scheduling would multiply
# outbound traffic by N and break the upstream rate-limit budget.
# Quarkus duration-string syntax.
#
# Per-profile defaults per design §10.4:
#   laptop     = 60s   (dev iteration speed)
#   vps        = 90s   (production conservative)
#   pi         = 300s  (slow hardware + minimise upstream pressure)
#   remote-llm = 90s   (same as vps; LLM hardware locality is
#                       irrelevant to asset HTTP fetch cadence)
#
# The base default `90s` matches the vps / remote-llm value and
# provides the test-time fallback the same way infochat.heartbeat.interval
# does — Quarkus' `test` profile does not inherit %<infochat-profile>
# namespaces, so the base value applies during @QuarkusTest. Inlining
# the default in AssetSnapshotFetcher.java via
# @ConfigProperty(defaultValue=...) is forbidden for profile-driven keys
# (FetchScheduler.java:95-100 convention). Operator override:
# -Dinfochat.assets.refresh.<host>=<duration>.
infochat.assets.refresh.bitfinex=90s
infochat.assets.refresh.coingecko=90s
infochat.assets.refresh.kraken=90s

# StreamSourceSupervisor graceful-shutdown drain budget. On Collector
# shutdown the supervisor calls each StreamSource's stop() (where the impl
# flushes in-flight events to the outbox per docs/spec/architecture.md
# §Ingest SPIs) and waits up to this TOTAL timeout for all of them.
# Events not flushed within the budget are dropped and the per-source
# "events lost on shutdown" counter increments.
#
# Defaults per profile:
#   laptop     = 10s
#   vps        = 30s
#   pi         = 10s
#   remote-llm = 30s
#
# The base default below provides the test-time fallback the same way
# infochat.heartbeat.interval does — Quarkus' `test` profile does not
# inherit any %<infochat-profile> namespace, so the base value applies
# during @QuarkusTest. Inlining the default in StreamSourceSupervisor.java
# via @ConfigProperty(defaultValue=...) is forbidden for profile-driven
# keys (FetchScheduler.java:95-100 convention).
infochat.stream.drain-timeout=5s

# NostrStreamSource per-relay reconnect backoff. On disconnect each relay
# connection waits an exponentially-growing, jittered delay before
# reconnecting (NostrRelayConnection.backoffDelay): the deterministic
# component doubles from base-delay up to max-delay, the jittered delay lands
# in the upper half of that, so the floor still grows per attempt — no tight-
# loop reconnect storm.
#
# Unlike infochat.stream.drain-timeout these are base-only (no per-profile
# overrides), like the infochat.fetch.<kind>.interval keys: reconnect cadence
# is a relay/network property, not a hardware-profile one, so a Pi and a VPS
# back off identically. Read via @ConfigProperty in NostrStreamSource.Registrar;
# inlining the default in source via @ConfigProperty(defaultValue=...) is
# forbidden for infochat.* tunables (FetchScheduler.java:95-100 convention).
# Operator override: -Dinfochat.stream.nostr.reconnect-{base,max}-delay=<duration>.
infochat.stream.nostr.reconnect-base-delay=1s
infochat.stream.nostr.reconnect-max-delay=60s

# Stage 1 prompt-injection regex set wall-clock watchdog cap. The
# per-input deadline for java.util.regex matcher execution per
# docs/design/04-security.md §4.2 Stage 1 step 3 ("the regex set runs
# under a watchdog"). On overrun the post is fail-closed to status
# 'QUARANTINED' and never auto-released — Stage 1 infrastructure
# failure per docs/spec/security.md §Failure handling.
#
# Defaults per profile (D41 / docs/design/04-security.md §4.2):
#   laptop     = 100ms (per-profile namespace below)
#   vps        = 100ms
#   pi         = 250ms (slower hardware; the same matcher takes longer)
#   remote-llm = 100ms (local CPU; the LLM is remote, but Stage 1 runs locally)
#
# The base default below provides the test-time fallback the same way
# infochat.heartbeat.interval does — Quarkus' `test` profile does not
# inherit any %<infochat-profile> namespace, so the base value applies
# during @QuarkusTest. Inlining the default in Stage1Pipeline.java via
# @ConfigProperty(defaultValue=...) is forbidden (Big-picture notes:
# "Inlining the default in the source is a v1-shortcut anti-pattern").
infochat.security.stage1.regex-timeout-ms=100

# Stage 2 LLM-judge release-on-failure policy. Per
# docs/spec/security.md §Failure handling: a Stage 2 infrastructure
# failure (LLM unreachable, timeout, unparseable/schema-violating
# reply after retry) takes one of two paths depending on this flag.
#   true  → release as RAW with stage2_failed=true; the post follows
#           the same downstream path as BENIGN (Tagger → Embedding →
#           READY); Stage 1 redactions retained.
#   false → quarantine (status='QUARANTINED', stage2_failed=true);
#           the post never reaches the user-facing surface unless
#           admin /quarantine approve lifts it (T2-G).
#
# Profile defaults per docs/design/04-security.md §4.7:
#   laptop     = true  (local Ollama can crash under memory pressure)
#   pi         = true  (same; small models on small RAM)
#   vps        = false (production-quality LLM; an outage is real)
#   remote-llm = false (paid API; an outage is real)
#
# The base default below is `true` for the same reason as
# infochat.security.stage1.regex-timeout-ms: Quarkus' `test` profile
# does not inherit any %<infochat-profile> namespace, so the base
# value applies during @QuarkusTest. @TestProfile overrides this
# per-test where needed.
infochat.security.release-on-stage2-failure=true

# Per-task LLM router config. v1 wires SECURITY_JUDGE only (M1-033's
# first call site); Tagger / summarizer / chat-agent land their own
# property blocks as their tickets ship. The OpenAiCompatibleProvider
# is the only concrete LlmProvider in v1; (base-url, api-key, model)
# distinguish runtime providers per docs/design/05-llm-and-embeddings.md
# §5.3. The default endpoint is local Ollama at the standard
# OpenAI-compatible /v1 base path; operators override via -D or env
# (e.g. INFOCHAT_LLM_SECURITY_BASE_URL=https://api.openai.com/v1).
infochat.llm.local-only=false
infochat.llm.security.api-key=
infochat.llm.security.base-url=http://localhost:11434/v1
infochat.llm.security.max-concurrency=4
infochat.llm.security.model=llama3.2:3b
infochat.llm.security.timeout-ms=30000

# Test profile: halt the Quarkus scheduler at startup so background
# @Scheduled ticks do not pollute @QuarkusTest assertions on shared
# @ApplicationScoped beans. Without this, TaggerWorker's poll (every
# infochat.llm.tagger.poll-interval = 5s on laptop / under test) fires
# in the background during other ITs and calls the shared stub
# LlmProvider, double-counting stub invocations and racing partial
# results. The same race would re-emerge for every future @Scheduled
# eval-pipeline worker (M1-034b EmbeddingWorker, T2 chat-agent
# re-eval, ...), so the halt is set once here rather than per-worker.
# ITs that need a tick to fire (HeartbeatSchedulerIT from M1-009)
# inject io.quarkus.scheduler.Scheduler and call scheduler.resume()
# OR invoke the @Scheduled method directly.
%test.quarkus.scheduler.start-mode=halted

# Per-task LLM router config — Tagger (M1-034a's first call site).
# The Tagger reads post.body and asks the LLM to choose 1..4 tags
# from the M1-008b controlled vocabulary. The (base-url, api-key,
# model) shape mirrors infochat.llm.security.* above; per
# docs/design/05-llm-and-embeddings.md §5.7 the laptop default
# model is llama3.1:8b (one model class above the security judge
# because tagger output drives downstream retrieval; bad tags
# degrade /summary, /follow-tag, and chat-agent context recall).
# poll-interval matches the M1-028 FetchScheduler / M1-033 Stage 2
# cadence at 5s on laptop so a steady-state pipeline takes roughly
# one tick per stage to drain a post.
infochat.llm.tagger.api-key=
infochat.llm.tagger.base-url=http://localhost:11434/v1
infochat.llm.tagger.max-concurrency=4
infochat.llm.tagger.model=llama3.1:8b
infochat.llm.tagger.poll-interval=5s

# Per-task LLM router config — Entity extractor. Runs in parallel with
# the Embedding stage after the Tagger; reads post.body and asks the
# LLM for the named entities feeding D6 Tier-2 cross-source linking.
# The (base-url, api-key, model) shape mirrors infochat.llm.tagger.*
# above (same llama3.1:8b laptop default — entity output, like tag
# output, drives downstream retrieval quality). poll-interval matches
# the Tagger / Stage 2 / Fetch 5s cadence so a steady-state pipeline
# drains a post through entity extraction within roughly one tick.
infochat.llm.entity.api-key=
infochat.llm.entity.base-url=http://localhost:11434/v1
infochat.llm.entity.max-concurrency=4
infochat.llm.entity.model=llama3.1:8b
infochat.llm.entity.poll-interval=5s

# Embedding pipeline config (M1-034b — the first concrete
# EmbeddingProvider call site, plus the ReadyPromoter that finalises
# the RAW → READY transition). EmbeddingProvider is a distinct SPI
# from LlmProvider per docs/spec/llm.md §SPI shape "Scope of the
# enum. The embedder is not a ModelTask — EmbeddingProvider is a
# distinct SPI with its own provider selection." ONE provider per
# deployment; no per-language or per-task routing.
#
# The default endpoint targets local Ollama's OpenAI-compatible
# /embeddings surface (POST <base-url>/embeddings). The default
# model is nomic-embed-text, dimension 768, matching V11's seed row
# for the laptop / vps / remote-llm profiles per
# docs/design/05-llm-and-embeddings.md §5.5 / §5.7.
#
# batch-size = 16 on laptop balances Ollama throughput against
# memory pressure (16 short text inputs fit comfortably in a single
# embed call against nomic-embed-text without OOM on a laptop-class
# GPU). max-concurrency = 4 matches the §5.7 laptop bound for
# concurrent in-flight calls.
#
# allow-model-change=false is the safe default. The startup guard
# (EmbeddingMetadataStartupGuard) refuses Collector startup on any
# mismatch between configured (model, dimension) and the singleton
# embedding_metadata row. Operators set this flag to true ONLY when
# intentionally rotating to a new embedding model, AND must follow
# the re-embed procedure (docs/design/02-schema.md §2.8) afterwards.
#
# poll-interval = 5s matches the Tagger / Stage 2 / Fetch cadence
# so a steady-state pipeline drains a post through the Embedding +
# ReadyPromoter stages within roughly one tick each.
infochat.embeddings.allow-model-change=false
infochat.embeddings.api-key=
infochat.embeddings.base-url=http://localhost:11434/v1
infochat.embeddings.batch-size=16
infochat.embeddings.dimension=768
infochat.embeddings.max-concurrency=4
infochat.embeddings.model=nomic-embed-text
infochat.embeddings.poll-interval=5s

# Cross-source LinkingJob config (M1-093). Consumes post_entity (V28)
# and post_embedding (V11) and writes bidirectional post_reference
# (V29) edges for the Tier-2 retrieval surface (D6). All keys carry
# base defaults so Quarkus' `test` profile (which does not inherit
# %<infochat-profile>) boots cleanly; the per-profile overrides below
# carry the production-facing values per docs/design/05-llm-and-embeddings.md
# §5.7.
#
# infochat.linking.interval        — @Scheduled tick cadence.
#                                    laptop/remote-llm 5m, vps 15m, pi 30m.
# infochat.linking.lookback-days   — driving-set + candidate window cap.
#                                    Posts older than this are not picked
#                                    or matched against. 4d matches the
#                                    pipeline's READY-retention horizon.
# infochat.linking.semantic-window-hours — additional window narrowing for
#                                    the semantic-match query (semantic
#                                    cross-source linking is most valuable
#                                    on co-temporal posts). 48h default.
# infochat.linking.semantic-threshold — pgvector cosine_distance ceiling
#                                    (lower = stricter). Per profile per
#                                    §5.7: laptop/vps/remote-llm 0.18,
#                                    pi 0.20 (looser to compensate for the
#                                    smaller embedding model on Pi).
# infochat.linking.max-links-per-post — per-driving-post outbound link cap.
#                                    Highest-score edges win when exceeded.
infochat.linking.interval=5m
infochat.linking.lookback-days=4
infochat.linking.semantic-window-hours=48
infochat.linking.semantic-threshold=0.18
infochat.linking.max-links-per-post=10

# Per-profile namespaces — populated by later feature tickets (context
# window, eval concurrency, vector index type, etc.). Each profile
# carries one placeholder so the namespace exists in v1 and later
# tickets have somewhere to layer real values onto. Keys within each
# profile block stay lexicographically sorted.
%laptop.infochat.assets.refresh.bitfinex=60s
%laptop.infochat.assets.refresh.coingecko=60s
%laptop.infochat.assets.refresh.kraken=60s
%laptop.infochat.fetch.bluesky.page-cap=5
%laptop.infochat.embeddings.max-concurrency=4
%laptop.infochat.heartbeat.interval=5s
%laptop.infochat.linking.interval=5m
%laptop.infochat.linking.semantic-threshold=0.18
%laptop.infochat.llm.entity.max-concurrency=4
%laptop.infochat.llm.security.max-concurrency=4
%laptop.infochat.llm.tagger.max-concurrency=4
%laptop.infochat.profile.label=laptop
%laptop.infochat.security.release-on-stage2-failure=true
%laptop.infochat.security.stage1.regex-timeout-ms=100
%laptop.infochat.stream.drain-timeout=10s
%laptop.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/infochat
%pi.infochat.assets.refresh.bitfinex=300s
%pi.infochat.assets.refresh.coingecko=300s
%pi.infochat.assets.refresh.kraken=300s
%pi.infochat.fetch.bluesky.page-cap=2
%pi.infochat.embeddings.max-concurrency=1
%pi.infochat.fetch.reddit.page-cap=2
%pi.infochat.linking.interval=30m
%pi.infochat.linking.semantic-threshold=0.20
%pi.infochat.llm.entity.max-concurrency=1
%pi.infochat.llm.security.max-concurrency=1
%pi.infochat.llm.tagger.max-concurrency=1
%pi.infochat.profile.label=pi
%pi.infochat.security.release-on-stage2-failure=true
%pi.infochat.security.stage1.regex-timeout-ms=250
%pi.infochat.stream.drain-timeout=10s
%pi.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/infochat
%remote-llm.infochat.assets.refresh.bitfinex=90s
%remote-llm.infochat.assets.refresh.coingecko=90s
%remote-llm.infochat.assets.refresh.kraken=90s
%remote-llm.infochat.fetch.bluesky.page-cap=5
%remote-llm.infochat.embeddings.max-concurrency=8
%remote-llm.infochat.linking.interval=5m
%remote-llm.infochat.linking.semantic-threshold=0.18
%remote-llm.infochat.llm.anthropic.languages=en,cs
%remote-llm.infochat.llm.chat.base-url=https://api.anthropic.com/v1
%remote-llm.infochat.llm.chat.max-tokens=2048
%remote-llm.infochat.llm.chat.provider=anthropic
%remote-llm.infochat.llm.entity.max-concurrency=8
%remote-llm.infochat.llm.security.max-concurrency=8
%remote-llm.infochat.llm.summarizer.base-url=https://api.anthropic.com/v1
%remote-llm.infochat.llm.summarizer.max-tokens=4096
%remote-llm.infochat.llm.summarizer.provider=anthropic
%remote-llm.infochat.llm.tagger.max-concurrency=8
%remote-llm.infochat.profile.label=remote-llm
%remote-llm.infochat.security.release-on-stage2-failure=false
%remote-llm.infochat.security.stage1.regex-timeout-ms=100
%remote-llm.infochat.stream.drain-timeout=30s
%remote-llm.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/infochat
%vps.infochat.assets.refresh.bitfinex=90s
%vps.infochat.assets.refresh.coingecko=90s
%vps.infochat.assets.refresh.kraken=90s
%vps.infochat.fetch.bluesky.page-cap=5
%vps.infochat.embeddings.max-concurrency=2
%vps.infochat.linking.interval=15m
%vps.infochat.linking.semantic-threshold=0.18
%vps.infochat.llm.entity.max-concurrency=2
%vps.infochat.llm.security.max-concurrency=2
%vps.infochat.llm.tagger.max-concurrency=2
%vps.infochat.profile.label=vps
%vps.infochat.security.release-on-stage2-failure=false
%vps.infochat.security.stage1.regex-timeout-ms=100
%vps.infochat.stream.drain-timeout=30s
%vps.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/infochat
