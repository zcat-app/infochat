%laptop.quarkus.datasource.jdbc.max-size=20
%laptop.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/infochat
%laptop.quarkus.datasource.owner.jdbc.url=jdbc:postgresql://localhost:5432/infochat
%pi.infochat.assets.refresh.bitfinex=300s
