# infochat-collector — datasource, Flyway, and profile namespaces.
#
# Collector owns Flyway in v1 (see M1-005 Big-picture notes for the
# rationale; migrations move to infochat-core after M1-007a). Provider
# connects to the same Postgres but does not migrate.
#
# Layering: these are the baked-in DEFAULTS, compiled into the app. In a
# deployment, prod/runtime/application.properties is mounted at
# /app/config/application.properties (docker-compose) and OVERRIDES any key it
# sets — the values the setup wizard writes there (profile, datasource, LLM,
# adapters, bootstrap paths) win over the defaults here. Editing a key here only
# affects a deployment that does NOT override it. (07-deployment.md §7.4)

# HTTP listener — serves only the SmallRye Health probes in v1
# (/q/health/live, /q/health/ready; docs/design/07-deployment.md §7.12).
# Per-service port (collector=8080, provider=8081) so the two services
# never collide on a single host (07-deployment.md §Per-service
# application.properties). @QuarkusTest binds quarkus.http.test-port
# (default 8081) instead, so this key is inert under %test.
quarkus.http.port=8080
# Loopback bind: the health probes above are unauthenticated and
# enumerate operational topology, so the shipped default keeps them
# host-local. Override per-profile/env (QUARKUS_HTTP_HOST) — and
# firewall the port to the prober — when probing from another host
# (07-deployment.md §7.12.1). Tests are unaffected: they connect via
# localhost, which is exactly this interface.
quarkus.http.host=127.0.0.1

# Least-privilege role split (docs/spec/security.md §DB roles; V31 grants
# the service roles LOGIN). The DEFAULT datasource connects as the
# per-service role so every plain @Inject DataSource site — including any
# future code that forgets to qualify — gets the weak principal
# (fail-closed). The bootstrap `infochat` owner lives on the named
# `owner` datasource below, used only by Flyway (migrations run as owner)
# and schema-DDL paths (partition provisioning).
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=infochat_collector
# No baked-in fallback on the production-shaped keys (this one and the
# owner key below): a deployment that forgets the env var must fail
# startup fast instead of connecting with a publicly known dev password
# (docs/design/07-deployment.md §Environment variables: required, no
# default). %dev/%test carry the dev-only value explicitly; under %test
# the DevServices container's trust auth makes the value inert anyway.
quarkus.datasource.password=${INFOCHAT_COLLECTOR_PASSWORD}
%dev.quarkus.datasource.password=infochat-dev
%test.quarkus.datasource.password=infochat-dev

# Owner datasource — Flyway + partition DDL only. Password env per
# docs/design/07-deployment.md §Operator inputs.
quarkus.datasource.owner.db-kind=postgresql
quarkus.datasource.owner.username=infochat
quarkus.datasource.owner.password=${INFOCHAT_DB_PASSWORD}
%dev.quarkus.datasource.owner.password=infochat-dev
%test.quarkus.datasource.owner.password=infochat-dev

# DevServices uses the same pgvector image as docker-compose so the
# `CREATE EXTENSION vector` in V1__init.sql works against the ephemeral
# test container the same way it does against the operator's DB. The
# JDBC URL is intentionally NOT declared at this base level — Quarkus
# DevServices treats "no URL configured" as its trigger to spin up a
# container, which is what the test profile relies on. Operator-facing
# profiles (laptop / vps / pi / remote-llm) declare the URL per-profile
# below so production runs connect to the configured Postgres instead.
quarkus.datasource.devservices.image-name=pgvector/pgvector:pg16

# Explicit Agroal pool ceiling (rather than the implicit Agroal default
# 20). Demand arithmetic: InstanceLockGuard pins 1 pool connection for
# the JVM lifetime (the advisory-lock session); EmbeddingWorker holds up
# to infochat.embeddings.max-concurrency connections concurrently during
# its post-embed writes; every other @Scheduled DB-touching job
# (Heartbeat, Fetch, PartitionCreator, Tagger, EntityExtractor,
# ReadyPromoter, Linking, ReEvaluation, PerSourceUnknownTracker,
# AdminReviewTtl, 3× per-host AssetSnapshotFetcher) holds at most 1
# transient connection per tick — 13 single-connection jobs in the
# pathological all-tick-at-once case.
#   laptop     = 20  (1 pinned + 4 embedding + 13 jobs = 18)
#   vps        = 16  (1 pinned + 2 embedding + 13 jobs = 16)
#   pi         → base fallback  (1 + 1 + 13 = 15 ≤ 24)
#   remote-llm → base fallback  (1 + 8 + 13 = 22 ≤ 24)
# The base default below provides the test-time fallback the same way
# infochat.heartbeat.interval does, and is sized for the worst
# per-profile demand (remote-llm at embeddings max-concurrency 8) so the
# %pi / %remote-llm fallback never under-provisions. A future
# profile-tuning ticket may pin those two profiles explicitly.
quarkus.datasource.jdbc.max-size=24

# The DevServices container's superuser identity is pinned to the owner —
# NOT derived from the (now weak-role) default-datasource username.
# Without the pin, DevServices would create `infochat_collector` as the
# container superuser; V2's create-if-absent would leave it superuser and
# the role split would silently stop being exercised under test while
# every assertion stayed green. Trust auth lets the V2-created
# (password-less) service roles log in inside the ephemeral test
# container; production role passwords come from the operator init
# script (docs/design/07-deployment.md §7.10), never from migrations.
quarkus.datasource.devservices.username=infochat
quarkus.datasource.devservices.container-env.POSTGRES_HOST_AUTH_METHOD=trust
# Reuse-requested containers get an org.testcontainers.hash label and NO org.testcontainers.sessionId label, and Ryuk reaps by sessionId — so they are reaper-exempt and leak per run; reuse=false keeps the test DB session-labelled and Ryuk-reaped (M1-554).
quarkus.datasource.devservices.reuse=false

# The owner datasource shares the ONE DevServices container — no second
# container: DevServices is disabled for it and under %test its URL is
# an expression that resolves at runtime to the DevServices-injected
# default-datasource URL.
quarkus.datasource.owner.devservices.enabled=false
%test.quarkus.datasource.owner.jdbc.url=${quarkus.datasource.jdbc.url}

# migrate-at-start ensures the DB schema is up to date before the
# Collector accepts work. Safe in v1 because the deployment shape is
# exactly one Collector and one Provider; concurrent migration attempts
# are not a v1 concern. Flyway is bound to the named owner datasource
# (the `owner` segment): migrations must run as the schema owner, not
# as the weak per-service role on the default datasource.
quarkus.flyway.owner.migrate-at-start=true

# infochat-llm-adapter ships @ApplicationScoped beans
# (OpenAiCompatibleProvider, LlmRouter, LlmRouterStartupGuard) that
# Quarkus's ArC must scan for CDI bean discovery. The module has no
# beans.xml and no jandex index in its JAR, so the consumer (this
# Collector) tells ArC to index it explicitly. M1-033's first LLM
# call site.
quarkus.index-dependency.llm-adapter.group-id=app.zcat.infochat
quarkus.index-dependency.llm-adapter.artifact-id=infochat-llm-adapter

# infochat-core ships @ApplicationScoped beans (AuditLogWriter,
# DefaultRedactionHook from M1-041) that Quarkus's ArC must scan for
# CDI bean discovery. Same shape as the infochat-llm-adapter entry
# above — the module has no beans.xml and no jandex index in its
# JAR, so this consumer tells ArC to index it explicitly.
quarkus.index-dependency.audit-core.group-id=app.zcat.infochat
quarkus.index-dependency.audit-core.artifact-id=infochat-core

# Stdout log redaction: every console log line passes through the
# closed API-key catalogue (Redactor) via RedactingLogFilter.
quarkus.log.console.filter=api-key-redactor

# Heartbeat tick base default. Quarkus' `test` profile (which @QuarkusTest
# runs under) does not inherit from any `%<infochat-profile>` namespace, so
# `%laptop.infochat.heartbeat.interval` is invisible to tests. Declaring
# the same value at base provides the test-time fallback while the
# `%laptop.*` declaration below remains the production-facing value
# (D41 / docs/design/07-deployment.md §7.8.5).
#
# %vps, %pi, and %remote-llm profiles intentionally do NOT yet declare this
# key — they fall back to the base value at deploy time. A future profile-
# tuning ticket adds explicit overrides per the design-suggested values in
# docs/design/07-deployment.md §7.2.1 (laptop stays at 5s; vps, pi, and
# remote-llm get their own values). Until that ticket lands, those three
# profiles silently inherit 5s from base, which is too aggressive for
# Pi-class hardware in particular — operator-side mitigation is to override
# `infochat.heartbeat.interval` via environment or system property.
infochat.heartbeat.interval=5s

# PartitionCreator tick cadence — how often the scheduler checks that next
# month's partition exists for every partitioned table (post, post_embedding,
# price_snapshot, post_entity, post_reference) and provisions it if missing.
# Profile-agnostic: month boundaries do not depend on hardware class, so a Pi
# and a VPS share one daily cadence. Daily is far inside the 25-day liveness
# threshold, so a few missed ticks never wedge inserts. Quarkus duration-string
# syntax; operator override: -Dinfochat.partitions.check-interval=<duration>.
infochat.partitions.check-interval=24h

# PartitionPruner tick cadence — how often the pruner drops partitions whose
# end date is older than the per-table retention horizon below (Invariant 6:
# aged out by partition drop, not row delete). Daily matches the monthly
# partition granularity with ample slack. Quarkus duration-string syntax;
# operator override: -Dinfochat.partitions.prune-interval=<duration>.
infochat.partitions.prune-interval=24h

# Per-table retention horizons in days (02-schema.md §2.4.4). post and the
# three derivative tables are profile-driven on one shared horizon (30d
# laptop/vps/remote-llm, 14d pi — see the %pi block below); price_snapshot shares one value across
# profiles. DROP is destructive; the floor guard in
# PartitionDdl.prunablePartitions keeps the current and next month's
# partitions regardless of these values.
infochat.partitions.retention-days.post=30
infochat.partitions.retention-days.post-embedding=30
infochat.partitions.retention-days.post-entity=30
infochat.partitions.retention-days.post-reference=30
infochat.partitions.retention-days.price-snapshot=7

# FetchScheduler heartbeat — how often the scheduler wakes to check
# whether any source kind is due for a tick. Each kind's own interval
# (infochat.fetch.<kind>.interval) gates actual dispatch. 1m keeps
# latency under one minute for the shortest per-kind interval.
infochat.fetch.heartbeat-interval=1m

# D42 per-source failure ladder threshold — the consecutive-failure
# count at which FetchScheduler transitions a source from
# status='active' to status='failed' and fires a throttled admin
# notification (one EMITTED per crossing, coalesced per source).
# Single-global value (not profile-driven): the failure-ladder
# semantics are a deployment policy, not a hardware-class tuning
# knob, so a Pi and a VPS share the same threshold. Inline
# defaultValue=5 is mirrored on the @ConfigProperty in
# FetchScheduler.java so a test profile without the key still boots.
# Operator override: -Dinfochat.fetch.failure-threshold=<count>.
infochat.fetch.failure-threshold=5

# Per-host outbound pacing (M1-466). Minimum wall-clock gap between two
# outbound fetch requests to the SAME host. When a kind is due, its sources
# are dispatched at most one-per-host-per-window; a due source whose host
# was requested within the window is deferred to a later heartbeat (never
# dropped, never postponed a whole kind-interval). Keyed on host, not kind,
# so the ~22 nitter feeds that all share rss.xcancel.com drain ~1/window
# instead of bursting and tripping the host's 403 rate limit.
#
# `off` (or absent) disables pacing entirely — the same disable sentinel as
# infochat.linking.interval / infochat.reeval.poll-interval; the collector
# test profile sets it `off` so existing FetchScheduler ITs keep their
# single-tick behavior. Quarkus duration-string syntax otherwise.
#
# Single-global value (not profile-driven): host-politeness is a property of
# the upstream host, not the local hardware class, so a Pi and a VPS pace
# identically. Pacing is heartbeat-quantized — effective spacing is at most
# one dispatch per host per heartbeat when the window <= the heartbeat (see
# docs/design/01-architecture.md §1.3.1). Operator override:
# -Dinfochat.fetch.host-min-interval=<duration|off>.
infochat.fetch.host-min-interval=20s

# Per-kind fetch interval — each source kind ticks at its own cadence.
# Default (when no kind-specific key exists) is 5m. Quarkus
# duration-string syntax. Operator override:
# -Dinfochat.fetch.<kind>.interval=<duration>.
infochat.fetch.rss.interval=5m
infochat.fetch.bluesky.interval=10m
infochat.fetch.nitter.interval=10m
infochat.fetch.reddit.interval=30m
infochat.fetch.odysee.interval=30m
infochat.fetch.youtube.interval=30m

# D42 re-probe ladder (as amended by M1-752; M1-754). A source parked by
# consecutive fetch failures (park_reason='fetch-failure' ONLY — security
# parks stay manual) is re-probed on exponential backoff: first probe
# first-delay after the job first sees the park, then
# first-delay * backoff-factor^k, capped at backoff-ceiling, until the
# absolute cap terminally parks it. The counter clears only after a
# restored source stays healthy for the sustained-success window (flap
# containment: a restore alone never refills the budget). Values chosen
# against the 2026-08-02 live evidence (recurring upstream throttling
# routinely outlasting a 2.5h window): 6h first probe, doubling to a 4-day
# ceiling, 10 probes ≈ 3 weeks of coverage before terminal park.
#
# Uniform across hardware profiles (the failure-threshold precedent):
# re-probe cadence is upstream-facing deployment policy, not a
# hardware-class knob — any key still takes a per-profile or -D override.
# poll-interval accepts `off` (test profile) like reeval.poll-interval.
infochat.fetch.reprobe.poll-interval=15m
infochat.fetch.reprobe.first-delay=6h
infochat.fetch.reprobe.backoff-factor=2.0
infochat.fetch.reprobe.backoff-ceiling=4d
infochat.fetch.reprobe.cap=10
infochat.fetch.reprobe.sustained-success-window=24h

# Recurring parked-set summary (M1-754): one operator notification per
# cadence enumerating every status='failed' source (uuid, reason,
# parked-since; never the identifier URL), silent when the set is empty.
# Cadence must stay ABOVE infochat.admin-notifier.throttle-window (1h
# default) — the summary reuses notifyOnce with a constant key, so a
# cadence inside the window would be suppressed as a duplicate.
# `off` disables (test profile).
infochat.fetch.parked-summary.interval=24h

# Per-host asset-snapshot tick cadence (D33, D42 — design §10.4). One
# @Scheduled tick per data-source host (coingecko / kraken / bitfinex),
# NOT per-(asset, sub_verb) — spec §Asset commands commits to "all
# kraken snapshots across every enabled asset share one tick cadence;
# same for coingecko and bitfinex". Per-pair scheduling would multiply
# outbound traffic by N and break the upstream rate-limit budget.
# Quarkus duration-string syntax.
#
# Per-profile defaults per design §10.4:
#   laptop     = 60s   (dev iteration speed)
#   vps        = 90s   (production conservative)
#   pi         = 300s  (slow hardware + minimise upstream pressure)
#   remote-llm = 90s   (same as vps; LLM hardware locality is
#                       irrelevant to asset HTTP fetch cadence)
#
# The base default `90s` matches the vps / remote-llm value and
# provides the test-time fallback the same way infochat.heartbeat.interval
# does — Quarkus' `test` profile does not inherit %<infochat-profile>
# namespaces, so the base value applies during @QuarkusTest. Inlining
# the default in AssetSnapshotFetcher.java via
# @ConfigProperty(defaultValue=...) is forbidden for profile-driven keys
# (FetchScheduler.java:95-100 convention). Operator override:
# -Dinfochat.assets.refresh.<host>=<duration>.
infochat.assets.refresh.bitfinex=90s
infochat.assets.refresh.coingecko=90s
infochat.assets.refresh.kraken=90s

# StreamSourceSupervisor graceful-shutdown drain budget. On Collector
# shutdown the supervisor calls each StreamSource's stop() (where the impl
# flushes in-flight events to the outbox per docs/spec/architecture.md
# §Ingest SPIs) and waits up to this TOTAL timeout for all of them.
# Events not flushed within the budget are dropped and the per-source
# "events lost on shutdown" counter increments.
#
# Defaults per profile:
#   laptop     = 10s
#   vps        = 30s
#   pi         = 10s
#   remote-llm = 30s
#
# The base default below provides the test-time fallback the same way
# infochat.heartbeat.interval does — Quarkus' `test` profile does not
# inherit any %<infochat-profile> namespace, so the base value applies
# during @QuarkusTest. Inlining the default in StreamSourceSupervisor.java
# via @ConfigProperty(defaultValue=...) is forbidden for profile-driven
# keys (FetchScheduler.java:95-100 convention).
infochat.stream.drain-timeout=5s

# NostrStreamSource per-relay reconnect backoff. On disconnect each relay
# connection waits an exponentially-growing, jittered delay before
# reconnecting (NostrRelayConnection.backoffDelay): the deterministic
# component doubles from base-delay up to max-delay, the jittered delay lands
# in the upper half of that, so the floor still grows per attempt — no tight-
# loop reconnect storm.
#
# Unlike infochat.stream.drain-timeout these are base-only (no per-profile
# overrides), like the infochat.fetch.<kind>.interval keys: reconnect cadence
# is a relay/network property, not a hardware-profile one, so a Pi and a VPS
# back off identically. Read via @ConfigProperty in NostrStreamSource.Registrar;
# inlining the default in source via @ConfigProperty(defaultValue=...) is
# forbidden for infochat.* tunables (FetchScheduler.java:95-100 convention).
# Operator override: -Dinfochat.stream.nostr.reconnect-{base,max}-delay=<duration>.
infochat.stream.nostr.reconnect-base-delay=1s
infochat.stream.nostr.reconnect-max-delay=60s

# NostrStreamSource per-relay degradation thresholds (RelayHealthTracker).
# After `relay-failure-threshold` consecutive failures a relay enters a
# `cooldown-duration` window during which its worker parks instead of
# hot-looping reconnects (architecture.md §Ingest SPIs: "a single
# misbehaving relay MUST NOT block the StreamSource"). Once every
# relay is in cooldown the source is in an all-bad cycle; after
# `all-relays-bad-cycle-cap` consecutive cycles the source transitions
# to terminal `status='failed'` and an operator must `/source-enable`
# to restart it.
#
# Profile-driven because slower hardware (pi) benefits from longer
# cooldowns to reduce upstream pressure, and production-grade
# deployments (vps / remote-llm) can tolerate higher thresholds.
# Read via @ConfigProperty in NostrStreamSource.Registrar; inlining
# defaults in source via @ConfigProperty(defaultValue=...) is
# forbidden for profile-driven keys (FetchScheduler.java:95-100
# convention). The base values below provide the test-time fallback
# the same way infochat.heartbeat.interval does — Quarkus' `test`
# profile does not inherit any %<infochat-profile> namespace, so the
# base values apply during @QuarkusTest. The base values match the
# %laptop overrides below.
infochat.stream.nostr.all-relays-bad-cycle-cap=5
infochat.stream.nostr.cooldown-duration=5m
infochat.stream.nostr.relay-failure-threshold=3

# Stage 1 prompt-injection regex set wall-clock watchdog cap. The
# per-input deadline for java.util.regex matcher execution per
# docs/design/04-security.md §4.2 Stage 1 step 3 ("the regex set runs
# under a watchdog"). On overrun the post is fail-closed to status
# 'QUARANTINED' and never auto-released — Stage 1 infrastructure
# failure per docs/spec/security.md §Failure handling.
#
# Defaults per profile (D41 / docs/design/04-security.md §4.2):
#   laptop     = 100ms (per-profile namespace below)
#   vps        = 100ms
#   pi         = 250ms (slower hardware; the same matcher takes longer)
#   remote-llm = 100ms (local CPU; the LLM is remote, but Stage 1 runs locally)
#
# The base default below provides the test-time fallback the same way
# infochat.heartbeat.interval does — Quarkus' `test` profile does not
# inherit any %<infochat-profile> namespace, so the base value applies
# during @QuarkusTest. Inlining the default in Stage1Pipeline.java via
# @ConfigProperty(defaultValue=...) is forbidden (Big-picture notes:
# "Inlining the default in the source is a v1-shortcut anti-pattern").
infochat.security.stage1.regex-timeout-ms=100

# Stage 1 match-count cap. Hard upper bound on how many regex Match
# tuples may accumulate across all rules for one feed body before
# Stage 1 fails closed (whole-body QUARANTINED, rule_id='match_overflow',
# error_class='stage1.match_overflow'). Orthogonal to the wall-clock
# watchdog above: that bounds scan *time*, this bounds match *volume*
# so a crafted feed body (bounded by the SSRF body cap x rule count)
# cannot transiently allocate a huge match list inside the watchdog
# window. The cap exists for the pathological case only — a real post
# hits a handful of injection patterns at most, so 1000 sits
# comfortably above any legitimate feed. Hardware-independent (a match
# count, not a duration), so unlike regex-timeout-ms it carries no
# per-%<infochat-profile> overrides. Base value applies during
# @QuarkusTest the same way (Quarkus' `test` profile inherits no
# %<infochat-profile> namespace); inlining the default via
# @ConfigProperty(defaultValue=...) is forbidden per the M1-028
# precedent.
infochat.security.stage1.max-matches=1000

# Stage 1 body remediation job (M1-786): one-shot-draining conversion of
# post.body / saved_post.body rows stored before M1-784's plain-text
# sink, gated at-most-once per row by the V79 body_remediated_at marker.
# The poll interval is the scheduler cadence (a drained corpus makes a
# tick a cheap no-op against the partial indexes); the batch size bounds
# rows converted per tick. Hardware-independent, so no per-profile
# overrides; no inline defaultValue per the M1-028 precedent.
infochat.security.stage1.remediation-poll-interval=10m
infochat.security.stage1.remediation-batch-size=128

# Stage 2 LLM-judge release-on-failure policy. Per
# docs/spec/security.md §Failure handling: a Stage 2 infrastructure
# failure (LLM unreachable, timeout, unparseable/schema-violating
# reply after retry) takes one of two paths depending on this flag.
#   true  → release as RAW with stage2_failed=true; the post follows
#           the same downstream path as BENIGN (Tagger → Embedding →
#           READY); Stage 1 redactions retained.
#   false → quarantine (status='QUARANTINED', stage2_failed=true);
#           the post never reaches the user-facing surface unless
#           admin /quarantine approve lifts it (T2-G).
#
# Profile defaults per docs/design/04-security.md §4.7:
#   laptop     = true  (local Ollama can crash under memory pressure)
#   pi         = true  (same; small models on small RAM)
#   vps        = false (production-quality LLM; an outage is real)
#   remote-llm = false (paid API; an outage is real)
#
# The base default below is `true` for the same reason as
# infochat.security.stage1.regex-timeout-ms: Quarkus' `test` profile
# does not inherit any %<infochat-profile> namespace, so the base
# value applies during @QuarkusTest. @TestProfile overrides this
# per-test where needed.
infochat.security.release-on-stage2-failure=true

# Per-task LLM router config. One deployment runs ONE LLM service in
# practice (D56, M1-603): every ModelTask inherits the shared
# infochat.llm.default.{base-url,api-key} endpoint, and a per-task
# infochat.llm.<task>.base-url / .api-key override wins when present
# (docs/spec/llm.md §Per-task routing rules). There is deliberately NO
# unprofiled default and NO %remote-llm default: the bare-metal profiles
# (%laptop/%vps/%pi, in their blocks below) point at the on-host Ollama,
# while on remote-llm every task must be routed explicitly — so a stale
# operator config that predates a NEW ModelTask refuses boot naming the
# missing keys instead of silently inheriting a loopback address the
# host may not serve (the M1-597 classifier incident). Models stay
# per-task (task tuning per design §5.7), as do the non-route knobs
# (max-concurrency, poll-interval, timeout-ms).
#
# %test/%dev both carry a default so every @QuarkusTest and quarkus:dev
# boot keeps resolving task config (NORMAL-mode boots always have one of
# the four infochat profiles, enforced by InfochatProfile). %dev gets the
# on-host Ollama; %test gets the unreachable sentinel (M1-650) so an
# unstubbed path fails with connection refused rather than silently
# succeeding against whatever daemon holds 11434.
%test.infochat.llm.default.base-url=http://localhost:9
%dev.infochat.llm.default.base-url=http://localhost:11434/v1
infochat.llm.local-only=false
infochat.llm.security.max-concurrency=4
infochat.llm.security.model=llama3.2:3b
infochat.llm.security.timeout-ms=30000

# Test profile: halt the Quarkus scheduler at startup so background
# @Scheduled ticks do not pollute @QuarkusTest assertions on shared
# @ApplicationScoped beans. Without this, TaggerWorker's poll (every
# infochat.llm.tagger.poll-interval = 5s on laptop / under test) fires
# in the background during other ITs and calls the shared stub
# LlmProvider, double-counting stub invocations and racing partial
# results. The same race would re-emerge for every future @Scheduled
# eval-pipeline worker (M1-034b EmbeddingWorker, T2 chat-agent
# re-eval, ...), so the halt is set once here rather than per-worker.
# ITs that need a tick to fire (HeartbeatSchedulerIT from M1-009)
# inject io.quarkus.scheduler.Scheduler and call scheduler.resume()
# OR invoke the @Scheduled method directly.
%test.quarkus.scheduler.start-mode=halted

# Per-task LLM router config — Tagger (M1-034a's first call site).
# The Tagger reads post.body and asks the LLM to choose 1..4 tags
# from the M1-008b controlled vocabulary. The endpoint comes from the
# shared infochat.llm.default.* keys above (D56); per
# docs/design/05-llm-and-embeddings.md §5.7 the laptop default
# model is llama3.1:8b (one model class above the security judge
# because tagger output drives downstream retrieval; bad tags
# degrade /summary, /follow-tag, and chat-agent context recall).
# poll-interval matches the M1-028 FetchScheduler / M1-033 Stage 2
# cadence at 5s on laptop so a steady-state pipeline takes roughly
# one tick per stage to drain a post.
infochat.llm.tagger.max-concurrency=4
infochat.llm.tagger.model=llama3.1:8b
infochat.llm.tagger.poll-interval=5s

# Misc-share monitor (M1-865, decision 5): alerts when the share of tagger
# completions resolving to the Others-top 'misc' leaf exceeds the threshold —
# the trigger that the leaf list needs to grow. docs/design §5.4.2.
infochat.tagger.misc-share-window-size=50
infochat.tagger.misc-share-min-sample=20
infochat.tagger.misc-share-threshold=0.10

# Per-task LLM router config — Entity extractor. Runs in parallel with
# the Embedding stage after the Tagger; reads post.body and asks the
# LLM for the named entities feeding D6 Tier-2 cross-source linking.
# Endpoint from the shared default (D56); same llama3.1:8b laptop
# default model as the tagger — entity output, like tag output, drives
# downstream retrieval quality. poll-interval matches the Tagger /
# Stage 2 / Fetch 5s cadence so a steady-state pipeline drains a post
# through entity extraction within roughly one tick.
infochat.llm.entity.max-concurrency=4
infochat.llm.entity.model=llama3.1:8b
infochat.llm.entity.poll-interval=5s

# Per-task LLM router config — Classifier (M1-597). Runs in parallel with
# the Entity extractor and Embedding stages after the Tagger; reads
# post.body and asks the LLM for the fixed closed-enum classification
# labels {factual, opinion, technical, urgent, ongoing, unknown} shown in
# /summary. Endpoint from the shared default (D56) — under remote-llm the
# route must be configured explicitly like every other task (no baked
# loopback fallback; that fallback IS the M1-597 incident this key layout
# prevents). Same llama3.1:8b laptop default model as tagger/entity.
# poll-interval matches the Tagger / Entity / Stage 2 / Fetch 5s cadence
# so a steady-state pipeline drains a post through classification within
# roughly one tick.
infochat.llm.classifier.max-concurrency=4
infochat.llm.classifier.model=llama3.1:8b
infochat.llm.classifier.poll-interval=5s

# Sleep-before-retry backoff for the eval workers' single LLM retry
# (Stage 2 judge, Tagger, Entity extractor). Applies only to the
# infrastructure-shaped failure arm (the provider call threw — the
# rate-limited 429/503 case); schema-garbage / zero-valid retry
# shapes re-issue immediately. The worker sleeps base +
# uniform(0, base/2) jitter before its one spec-mandated retry
# (docs/spec/security.md §Failure handling fixes the COUNT at one;
# the timing is this knob). 0 disables the sleep. Operators on the
# remote-llm profile can raise this toward their API's typical
# Retry-After window (e.g. 10000).
infochat.llm.retry-backoff-ms=2000

# Router-level circuit breaker (M1-606): per-endpoint fail-fast for
# every LLM/embedding transport call. After failure-threshold
# CONSECUTIVE transport-unreachable failures (connection refused, DNS,
# no route, timeout — never application errors) an endpoint's breaker
# trips OPEN and calls short-circuit without an HTTP attempt; after
# cooldown-ms one probe is admitted (success closes, failure re-opens).
# Fail-FAST only, never fail-over: the task still degrades to its own
# failure path (docs/spec/security.md §Failure handling). The values
# below are the documented defaults for ALL profiles (laptop / vps /
# pi / remote-llm): outage semantics don't vary with hardware sizing,
# so no profile overrides them. Threshold 3 tolerates a transient
# blip; 30s spares an outage's doomed connect waits while noticing
# recovery promptly. Same values as the Provider's block.
# An OPEN transition (trip, failed-probe re-open) raises a throttled admin
# notification under error_class llm-breaker-open; recovery notifies nothing.
infochat.llm.breaker.failure-threshold=3
infochat.llm.breaker.cooldown-ms=30000

# Per-task LLM router config — Summarizer, Chat agent, Translator.
# The chat live call site runs in the Provider service; the summarizer
# and translator run in BOTH services (the Provider's /summary and
# chat-side translation and, in the Collector, the BodySummaryWorker
# since M1-715 and the IngestTranslationWorker since M1-749).
# LlmRouter.assertAllTasksResolve() eagerly resolves every ModelTask's
# per-task config at startup wherever the adapter boots (a missing or
# typoed required key must refuse boot, not silently degrade the first
# live call), so the Collector declares the same per-task models; the
# endpoint comes from the shared infochat.llm.default.* keys (D56).
# Model per docs/design/05-llm-and-embeddings.md §5.1 (llama3.1:8b).
infochat.llm.summarizer.model=llama3.1:8b
infochat.llm.chat.model=llama3.1:8b
infochat.llm.translator.model=llama3.1:8b

# Body-summary worker (M1-715) — the Collector-side ingest stage that
# writes post.body_summary (an LLM abstract) for posts whose body
# exceeds infochat.summarizer.threshold-chars, after the Tagger and
# before Embedding/ReadyPromoter, which gate on
# (summary_done OR length(body) <= threshold) — under-threshold posts
# never reach the LLM and never wait
# (docs/design/05-llm-and-embeddings.md §5.5 Input-text decision).
# poll-interval matches the other post-tagger workers' 5s cadence so a
# steady-state pipeline drains a post through summarization within
# roughly one tick. max-chars is the storage hard cap on the abstract:
# the prompt asks for <= 300 chars; the cap bounds a verbose or
# injected reply before it reaches post.body_summary (and thereby every
# future embedding input). Set poll-interval=off to disable the worker
# (the infochat.linking.interval=off idiom); the gates then strand
# over-threshold posts, so disabling IS an operator decision, not a
# tuning knob.
infochat.llm.summarizer.max-concurrency=4
infochat.llm.summarizer.poll-interval=5s
infochat.summarizer.threshold-chars=1200
infochat.summarizer.max-chars=500

# Ingest-translation worker (M1-749) — the Collector-side ingest stage
# that writes post.title_en / post.body_en (the D29 English anchor
# fields retrieval runs against) for posts from non-English sources,
# after the Tagger (translation ALWAYS runs after security evaluation)
# and before Embedding, which gates on translation_done = TRUE. A
# source.language='en' post is flipped done with NO translator dispatch.
# poll-interval matches the other post-tagger workers' 5s cadence so a
# steady-state pipeline drains a post through translation within
# roughly one tick. Set poll-interval=off to disable the worker (the
# infochat.linking.interval=off idiom); the embedding gate then strands
# every new post out of READY, so disabling IS an operator decision,
# not a tuning knob.
infochat.llm.translator.max-concurrency=4
infochat.llm.translator.poll-interval=5s

# Anchor re-drive ladder (M1-760). Two exhausted attempts release a post
# with a NULL English anchor; this ladder tries again on a slow schedule
# so a transient translator outage does not leave a permanent per-post
# defect. Its OWN poll-interval and max-per-tick, deliberately: a re-drive
# backlog must never consume first-pass batch capacity.
#
# The rungs are first-delay * backoff-factor^k capped at backoff-ceiling
# (the infochat.fetch.reprobe ladder's formula), so these values place
# attempts at +6h, +18h, +42h, +90h, +138h and +186h after the release —
# a 7.75-day span. The ENTIRE span must land inside the partition scan
# window (retention-days.post + PartitionScan.PARTITION_SCAN_SLACK),
# which is only 16 days on %pi: a rung past that floor is silently
# unreachable, the post drops out of the enumeration with its stamp still
# set, and nothing reports it. IngestTranslationWorkerTest pins the
# shipped values against every profile's window, so widening the ceiling
# or the cap fails the build rather than quietly losing the tail rungs.
# The reprobe ladder's own values (ceiling 4d, cap 10) overrun %pi and
# are NOT copied here.
infochat.llm.translator.redrive.poll-interval=30m
infochat.llm.translator.redrive.first-delay=6h
infochat.llm.translator.redrive.backoff-factor=2.0
infochat.llm.translator.redrive.backoff-ceiling=48h
infochat.llm.translator.redrive.cap=6
infochat.llm.translator.redrive.max-per-tick=2

# Embedding pipeline config (M1-034b — the first concrete
# EmbeddingProvider call site, plus the ReadyPromoter that finalises
# the RAW → READY transition). EmbeddingProvider is a distinct SPI
# from LlmProvider per docs/spec/llm.md §SPI shape "Scope of the
# enum. The embedder is not a ModelTask — EmbeddingProvider is a
# distinct SPI with its own provider selection." ONE provider per
# deployment; no per-language or per-task routing.
#
# The default endpoint targets local Ollama's OpenAI-compatible
# /embeddings surface (POST <base-url>/embeddings). The default
# model is nomic-embed-text, dimension 768, matching V11's seed row
# for the laptop / vps / remote-llm profiles per
# docs/design/05-llm-and-embeddings.md §5.5 / §5.7.
#
# batch-size = 16 on laptop balances Ollama throughput against
# memory pressure (16 short text inputs fit comfortably in a single
# embed call against nomic-embed-text without OOM on a laptop-class
# GPU). max-concurrency = 4 matches the §5.7 laptop bound for
# concurrent in-flight calls.
#
# allow-model-change=false is the safe default. The startup guard
# (EmbeddingMetadataStartupGuard) refuses Collector startup on any
# mismatch between configured (model, dimension) and the singleton
# embedding_metadata row. Operators set this flag to true ONLY when
# intentionally rotating to a new embedding model, AND must follow
# the re-embed procedure (docs/design/02-schema.md §2.8) afterwards.
#
# poll-interval = 5s matches the Tagger / Stage 2 / Fetch cadence
# so a steady-state pipeline drains a post through the Embedding +
# ReadyPromoter stages within roughly one tick each.
infochat.embeddings.allow-model-change=false
infochat.embeddings.api-key=
infochat.embeddings.base-url=http://localhost:11434/v1
infochat.embeddings.batch-size=16
infochat.embeddings.dimension=768
infochat.embeddings.max-concurrency=4
infochat.embeddings.model=nomic-embed-text
infochat.embeddings.poll-interval=5s
# %test is the ONE exception to the unprofiled base-url above, mirroring
# the Provider's %test.infochat.embeddings.base-url (M1-644). Without it
# the unprofiled 11434 value LEAKS into the test profile, which is how
# the suite came to depend on a real ollama being up. The stub embedding
# providers are what actually keep it hermetic; this unreachable sentinel
# is the backstop that makes a FUTURE unstubbed path fail loudly (M1-650).
%test.infochat.embeddings.base-url=http://localhost:9

# Cross-source LinkingJob config (M1-093). Consumes post_entity (V28)
# and post_embedding (V11) and writes bidirectional post_reference
# (V29) edges for the Tier-2 retrieval surface (D6). All keys carry
# base defaults so Quarkus' `test` profile (which does not inherit
# %<infochat-profile>) boots cleanly; the per-profile overrides below
# carry the production-facing values per docs/design/05-llm-and-embeddings.md
# §5.7.
#
# infochat.linking.interval        — @Scheduled tick cadence.
#                                    laptop/remote-llm 5m, vps 15m, pi 30m.
# infochat.linking.lookback-days   — driving-set + candidate window cap.
#                                    Posts older than this are not picked
#                                    or matched against. 4d matches the
#                                    pipeline's READY-retention horizon.
# infochat.linking.semantic-window-hours — additional window narrowing for
#                                    the semantic-match query (semantic
#                                    cross-source linking is most valuable
#                                    on co-temporal posts). 48h default.
# infochat.linking.semantic-threshold — pgvector cosine_distance ceiling
#                                    (lower = stricter). 0.18 on every
#                                    profile per §5.7. The former %pi 0.20
#                                    margin compensated for a smaller Pi
#                                    embedder that v1 never shipped — all
#                                    profiles run the same 768-d nomic —
#                                    so the spread collapsed (M1-748).
# infochat.linking.max-links-per-post — per-driving-post outbound link cap.
#                                    Highest-score edges win when exceeded.
infochat.linking.interval=5m
infochat.linking.lookback-days=4
infochat.linking.semantic-window-hours=48
infochat.linking.semantic-threshold=0.18
infochat.linking.max-links-per-post=10

# Re-evaluation pipeline config (M1-122). Three @Scheduled background jobs
# consume these keys: ReEvaluationJob (infra-failure-cap, unknown-cap,
# needs-review-depth-threshold, poll-interval), PerSourceUnknownTracker
# (unknown-rate-threshold, unknown-rate-window, unknown-tracker-poll-interval),
# and AdminReviewTtlJob (admin-review-ttl, ttl-poll-interval). All nine are
# declared default-less on their @ConfigProperty / @Scheduled sites, so the
# base declarations below are MANDATORY for the collector to boot in every
# operator profile — without them startup fails with NoSuchElementException /
# scheduler-config-parse error. The base values double as the test-time
# fallback the same way infochat.heartbeat.interval does (Quarkus' `test`
# profile does not inherit any %<infochat-profile> namespace). Inlining these
# as @ConfigProperty(defaultValue=...) is forbidden for profile-driven keys
# (FetchScheduler.java:95-100 convention) — the values belong here so operators
# tune per profile.
#
# Six keys carry per-profile overrides below, sourced from
# docs/design/04-security.md §Re-evaluation job (the re-eval cadence + caps
# table and the per-source UNKNOWN auto-disable table). The base value for
# each matches the vps / remote-llm production value:
#   poll-interval          laptop 10m,  vps 5m,   pi 30m,  remote-llm 5m
#   infra-failure-cap      laptop 6,    vps 12,   pi 4,    remote-llm 12
#   unknown-cap            laptop 3,    vps 6,    pi 2,    remote-llm 6
#   unknown-rate-threshold laptop 0.40, vps 0.30, pi 0.50, remote-llm 0.25
#   unknown-rate-window    laptop PT6H, vps PT1H, pi PT12H, remote-llm PT1H
#   cooldown               laptop 1h,   vps 30m,  pi 3h,   remote-llm 30m
# cooldown (M1-370) spaces successive re-judges of the same fail-open
# (infra-failure) post; each profile's value is 6x its poll-interval, so a
# post is re-judged at most once per six ticks rather than every tick. It
# tracks poll-interval per profile, hence the per-profile overrides.
#
# Four keys are single-global (no per-profile differentiation in the design,
# like infochat.fetch.failure-threshold):
#   admin-review-ttl              P14D  — the 14-day cap on PENDING quarantine
#                                         rows (schema Invariant 6; docs/design/
#                                         02-schema.md §2.5.1).
#   needs-review-depth-threshold  200   — NeedsReviewQueueDeep absolute-depth
#                                         backstop (docs/design/04-security.md
#                                         §Prometheus counters and alerts).
#   ttl-poll-interval             24h   — the admin-review TTL sweep runs on a
#                                         nightly cadence (02-schema.md §2.5.1);
#                                         a 14-day TTL needs no sub-day polling.
#   unknown-tracker-poll-interval 15m   — per-source UNKNOWN-rate sweep cadence;
#                                         no design-specified value, tuned to
#                                         bound detection latency against the
#                                         1h-12h evaluation windows.
infochat.reeval.admin-review-ttl=P14D
infochat.reeval.cooldown=30m
infochat.reeval.infra-failure-cap=12
infochat.reeval.needs-review-depth-threshold=200
infochat.reeval.poll-interval=5m
infochat.reeval.ttl-poll-interval=24h
infochat.reeval.unknown-cap=6
infochat.reeval.unknown-rate-threshold=0.30
infochat.reeval.unknown-rate-window=PT1H
infochat.reeval.unknown-tracker-poll-interval=15m

# Stale-RAW re-emitter (M1-295 / U-18 companion). Stage1Worker's
# eval-queue @Incoming consumer swallows an evaluation escape at its
# boundary and leaves the post status='RAW' so a poison message cannot
# kill the subscription; this scheduled sweep is the recovery half. It
# re-enqueues posts still stuck in status='RAW' past the age below,
# reusing the OutboxRehydrator query shape. A post still draining
# through the pipeline keeps a fresh status_changed_at and is NOT
# re-emitted; only genuinely-stranded posts are.
#
# poll-interval is single-global (the sweep cadence is a policy knob,
# not a hardware-class one, like infochat.fetch.failure-threshold).
# age is profile-driven: slower hardware (pi) drains the pipeline more
# slowly, so a healthy post legitimately sits RAW longer before it is
# "stuck". The base value matches the vps / remote-llm production value
# and provides the test-time fallback the same way
# infochat.heartbeat.interval does (Quarkus' `test` profile does not
# inherit any %<infochat-profile> namespace). Inlining the age default
# in Stage1Worker via @ConfigProperty(defaultValue=...) is forbidden
# for profile-driven keys (FetchScheduler.java:95-100 convention).
infochat.eval.stale-raw.poll-interval=5m
infochat.eval.stale-raw.age=30m

# ReadyPromoter (Stage 5 RAW → READY promotion) poll cadence. A distinct
# scheduled step, so it owns its own key rather than borrowing the
# embedding stage's — promote latency must not be coupled to embedding
# poll tuning. The default matches infochat.embeddings.poll-interval (5s)
# so steady-state behaviour is unchanged; like that key it carries no
# per-profile override (the base value applies to every profile, and is
# the test-time fallback Quarkus' `test` profile does not inherit any
# %<infochat-profile> namespace).
infochat.eval.ready-promoter.poll-interval=5s

# Eval-queue depth (profile bundle; docs/design/01-architecture.md §1.6/§1.7,
# docs/design/05-llm-and-embeddings.md §5.7). The capacity of the eval-queue
# emitter's buffer — how many persisted post keys queue up before the next
# Emitter.send throws SRMSG00034. Overflow is BUFFER-then-throw, never block:
# a SmallRye Emitter has no blocking back-pressure. No post is lost on
# overflow — every emit site persists status='RAW' before enqueueing, and
# Stage1Worker.reEmitStaleRaw's sweep re-enqueues whatever the buffer could
# not hold; the depth only changes WHEN the overflow fires, never what the
# catch paths do.
#
# Wired through SmallRye's emitter default-buffer-size: the eval-queue is
# the ONLY emitter channel in this service, so the service-wide default is
# effectively per-channel today — if a second emitter channel is ever added,
# this alias sizes both and the wiring must be revisited. @OnOverflow's
# bufferSize was rejected: it is a compile-time literal, which fights the
# per-profile requirement. The base value matches the laptop profile and is
# the test-time fallback (Quarkus' `test` profile inherits no
# %<infochat-profile> namespace). Inlining the default via
# @ConfigProperty(defaultValue=...) is forbidden for profile-driven keys
# (FetchScheduler.java:95-100 convention).
infochat.eval.queue-size=1024
smallrye.messaging.emitter.default-buffer-size=${infochat.eval.queue-size}

# Per-profile namespaces — populated by later feature tickets (context
# window, eval concurrency, vector index type, etc.). Each profile
# carries one placeholder so the namespace exists in v1 and later
# tickets have somewhere to layer real values onto. Keys within each
# profile block stay lexicographically sorted.
%laptop.infochat.assets.refresh.bitfinex=60s
%laptop.infochat.assets.refresh.coingecko=60s
%laptop.infochat.assets.refresh.kraken=60s
%laptop.infochat.fetch.bluesky.page-cap=5
%laptop.infochat.embeddings.max-concurrency=4
%laptop.infochat.eval.queue-size=1024
%laptop.infochat.eval.stale-raw.age=15m
%laptop.infochat.heartbeat.interval=5s
%laptop.infochat.linking.interval=5m
%laptop.infochat.linking.semantic-threshold=0.18
%laptop.infochat.llm.classifier.max-concurrency=4
%laptop.infochat.llm.default.base-url=http://localhost:11434/v1
%laptop.infochat.llm.entity.max-concurrency=4
%laptop.infochat.llm.security.max-concurrency=4
%laptop.infochat.llm.tagger.max-concurrency=4
