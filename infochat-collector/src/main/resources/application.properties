%vps.infochat.fetch.bluesky.page-cap=5
%vps.infochat.embeddings.max-concurrency=2
%vps.infochat.eval.queue-size=256
%vps.infochat.eval.stale-raw.age=30m
%vps.infochat.linking.interval=15m
%vps.infochat.linking.semantic-threshold=0.18
%vps.infochat.llm.classifier.max-concurrency=2
%vps.infochat.llm.default.base-url=http://localhost:11434/v1
%vps.infochat.llm.entity.max-concurrency=2
%vps.infochat.llm.security.max-concurrency=2
%vps.infochat.llm.tagger.max-concurrency=2
%vps.infochat.profile.label=vps
%vps.infochat.reeval.cooldown=30m
%vps.infochat.reeval.infra-failure-cap=12
%vps.infochat.reeval.poll-interval=5m
%vps.infochat.reeval.unknown-cap=6
%vps.infochat.reeval.unknown-rate-threshold=0.30
%vps.infochat.reeval.unknown-rate-window=PT1H
%vps.infochat.security.release-on-stage2-failure=false
%vps.infochat.security.stage1.regex-timeout-ms=100
%vps.infochat.stream.drain-timeout=30s
%vps.infochat.stream.nostr.all-relays-bad-cycle-cap=10
%vps.infochat.stream.nostr.cooldown-duration=10m
%vps.infochat.stream.nostr.relay-failure-threshold=5
%vps.quarkus.datasource.jdbc.max-size=16
%vps.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/infochat
%vps.quarkus.datasource.owner.jdbc.url=jdbc:postgresql://localhost:5432/infochat
