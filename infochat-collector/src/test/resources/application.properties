# infochat-collector — test-profile overrides activated by @QuarkusTest.
#
# Every @QuarkusTest in this module boots the full Collector app, which
# means the @Startup BootstrapLoader at @Priority(200) fires its
# @PostConstruct on every test. The loader's default config points at
# `bootstrap-sources.json` relative to the JVM working directory; that
# file does not exist in the module root during `mvn test/verify`. This
# property re-points the loader at the test fixture under
# `src/test/resources/bootstrap/` so the standard test surface (M1-003
# QuarkusBootstrapTest, M1-005 FlywayMigrationIT, M1-006 DbRoleMatrixIT,
# M1-009 InstanceLockGuardIT / HeartbeatSchedulerIT, M1-022
# BootstrapLoaderIT) all resolve the same fixture and boot cleanly.
#
# Any future @QuarkusTest in this module inherits the fixture
# automatically. A test that needs a different fixture (e.g. to assert
# the loader's fatal-log behavior on a missing file) declares its own
# @TestProfile overriding this property.
infochat.bootstrap.sources-file=src/test/resources/bootstrap/bootstrap-sources-fixture.json

# Re-evaluation job (M1-081a)
infochat.reeval.infra-failure-cap=3
infochat.reeval.unknown-cap=2
infochat.reeval.batch-size=16
infochat.reeval.needs-review-depth-threshold=5
infochat.reeval.poll-interval=off
infochat.reeval.unknown-tracker-poll-interval=off
infochat.reeval.ttl-poll-interval=off

# Eval-worker retry backoff — small but measurable so the worker
# backoff tests can assert "elapsed >= configured" without slowing
# every unreachable-path IT by the production 2 s default. Tests read
# this value via @ConfigProperty rather than hardcoding 50, so
# changing the test default here does not break the assertions.
infochat.llm.retry-backoff-ms=50

# LinkingJob (M1-093) — disable the scheduled tick during @QuarkusTest so
# background runs do not race the per-test fixtures. LinkingJobIT calls
# linkingJob.onTick() directly; unit tests in LinkingJobTest invoke the
# package-private methods directly. Same precedent as the reeval poll
# intervals above.
infochat.linking.interval=off

# D42 fetch failure ladder — small threshold so
# FetchSchedulerFailureLadderIT can hit the boundary in 3 ticks
# instead of 5. Tests read this value via @ConfigProperty rather than
# hardcoding 3, so changing the test default here does not break the
# assertions.
infochat.fetch.failure-threshold=3
infochat.reeval.unknown-rate-threshold=0.5
infochat.reeval.unknown-rate-window=PT1H
infochat.reeval.unknown-rate-min-sample=3
infochat.reeval.admin-review-ttl=PT24H
infochat.reeval.ttl-batch-size=32
