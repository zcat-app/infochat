# infochat-collector — test-profile overrides activated by @QuarkusTest.
#
# Every @QuarkusTest in this module boots the full Collector app, which
# means the @Startup BootstrapLoader at @Priority(200) fires its
# @PostConstruct on every test. The loader's default config points at
# `bootstrap-sources.json` relative to the JVM working directory; that
# file does not exist in the module root during `mvn test/verify`. This
# property re-points the loader at the test fixture under
# `src/test/resources/bootstrap/` so the standard test surface (M1-003
# QuarkusBootstrapTest, M1-005 FlywayMigrationIT, M1-006 DbRoleMatrixIT,
# M1-009 InstanceLockGuardIT / HeartbeatSchedulerIT, M1-022
# BootstrapLoaderIT) all resolve the same fixture and boot cleanly.
#
# Any future @QuarkusTest in this module inherits the fixture
# automatically. A test that needs a different fixture (e.g. to assert
# the loader's fatal-log behavior on a missing file) declares its own
# @TestProfile overriding this property.
infochat.bootstrap.sources-file=src/test/resources/bootstrap/bootstrap-sources-fixture.json
