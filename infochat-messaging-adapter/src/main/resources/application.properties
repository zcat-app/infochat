# Signal adapter operator configuration (documentary).
#
# These keys are read by SignalConfig (app.zcat.infochat.messaging.impl.signal).
# They are NOT read at runtime from this jar: Quarkus loads the application
# module's application.properties, not a dependency jar's. Real values live in
# Provider's application.properties (M1-105). The commented examples below
# document the expected shape.
#
# infochat.adapters.signal.binary=/usr/local/bin/signal-cli
# infochat.adapters.signal.data-dir=/var/lib/infochat/signal-cli
# infochat.adapters.signal.account=+15551234567
#
# Daemon JSON-RPC endpoint signal-cli listens on (TCP) and SignalJsonRpcClient
# connects to. signal-cli is launched as `signal-cli -a <account> --config <data-dir>
# daemon --tcp <host>:<port>` (M1-107: TCP chosen over Unix socket for cross-
# platform portability; localhost-only — see SignalSubprocess Javadoc). The port
# is hard-defaulted in SignalSubprocess for M1-107 because SignalConfig is out
# of this ticket's files_scope; Provider-side wiring (M1-105) re-reads these
# keys and constructs SignalAdapter with the configured port.
# infochat.adapters.signal.daemon-host=127.0.0.1
# infochat.adapters.signal.daemon-port=7583

# SimpleX adapter operator configuration (documentary).
#
# These keys are read by SimpleXConfig (app.zcat.infochat.messaging.impl.simplex).
# Same jar-loading note as the Signal block above: real values live in
# Provider's application.properties (M1-105).
#
# infochat.adapters.simplex.binary=/usr/local/bin/simplex-chat
# infochat.adapters.simplex.data-dir=/var/lib/infochat/simplex
# infochat.adapters.simplex.ws-port=5225
